<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góc nhỏ của Hana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
:root{--bg:#faf6f0;--card:#fff;--text:#2b2622;--muted:#8a7f74;--accent:#c4623a;--line:#e8dfd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#26221f;--text:#efe7dd;--muted:#a1968a;--accent:#e58a63;--line:#3a342f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#26221f;--text:#efe7dd;--muted:#a1968a;--accent:#e58a63;--line:#3a342f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.75 'Lora',Georgia,serif}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
header{padding:56px 0 28px;border-bottom:1px solid var(--line)}
header h1{font-size:2.2rem;margin:0 0 6px;line-height:1.2}
header h1 a{color:inherit;text-decoration:none}
header p{margin:0;color:var(--muted);font-style:italic}
nav{display:flex;gap:18px;margin-top:20px;font:500 14px 'Inter',system-ui,sans-serif}
nav a{color:var(--muted);text-decoration:none;cursor:pointer}
nav a:hover,nav a.on{color:var(--accent)}
.post{display:block;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.meta{font:13px 'Inter',system-ui,sans-serif;color:var(--muted);letter-spacing:.03em}
.post h2{margin:4px 0 6px;font-size:1.4rem;line-height:1.35}
.post:hover h2{color:var(--accent)}
.post p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0 4px;font:500 13px 'Inter',system-ui,sans-serif}
.chip{padding:5px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--card)}
.chip:hover,.chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.tag{font-weight:500}
.sn{display:flex;justify-content:space-between;gap:16px;margin:30px 0 10px;font:14px 'Inter',system-ui,sans-serif}
.sn a{color:var(--accent);text-decoration:none}
.sn span{max-width:48%}
.ph{line-height:1.4;margin:1.7em 0 .6em}
h2.ph{font-size:1.4rem}
h3.ph{font-size:1.15rem}
article ul{padding-left:1.3em;margin:0 0 1.2em}
article li{margin:.3em 0}
article strong{font-weight:600}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tbtn{font:500 13px 'Inter',system-ui,sans-serif;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.hint{font:12px 'Inter',system-ui,sans-serif;color:var(--muted);margin:6px 0 0}
article{padding:36px 0 20px}
article h1{font-size:2rem;line-height:1.3;margin:6px 0 24px}
article p{margin:0 0 1.2em}
.back{font:500 14px 'Inter',system-ui,sans-serif;color:var(--accent);cursor:pointer;text-decoration:none}
.bar{display:flex;gap:10px;align-items:center;margin-top:18px;font:500 14px 'Inter',system-ui,sans-serif}
.btn{font:500 14px 'Inter',system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
label{display:block;margin:18px 0 6px;font:500 13px 'Inter',system-ui,sans-serif;color:var(--muted)}
input,textarea{width:100%;font:16px/1.6 'Lora',Georgia,serif;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
#msg{color:var(--muted);font:14px 'Inter',system-ui,sans-serif;margin-left:10px}
footer{padding:36px 0 56px;color:var(--muted);font:13px 'Inter',system-ui,sans-serif;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1><a href="#">Góc nhỏ của mình</a></h1>
<p>Ghi lại những ngày bình thường, để sau này đọc lại còn thấy vui.</p>
<nav><a id="n-home" href="#" class="on">Bài viết</a><a id="n-about" href="#gioi-thieu" class="">Giới thiệu</a></nav>
</header>
<main id="app"></main>

<script id="data" type="application/json">[{"id":"nhung-viec-quan-trong-nhung-khong-gap-cai-gia-cua-viec-luon-de-ngay-mai-mw2abv5c","topic":"Tâm lý học","series":"","date":"4 tháng 11, 2026","title":"Những việc quan trọng nhưng không gấp: Cái giá của việc luôn để ngày mai","excerpt":"Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần …","body":["Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần dành quá nhiều sự quan tâm cho nó. Mình có thể tạm gác nó sang một bên, tiếp tục giải quyết những việc đang cần ưu tiên trước mắt và quay lại xử lý khi có nhiều thời gian hơn.","Cho đến khi mình nhận ra rằng không phải vấn đề nào cũng chờ mình sẵn sàng mới trở nên nghiêm trọng.","Trước đây, mình từng có những dấu hiệu mỏi cổ. Cảm giác ấy không quá nghiêm trọng đến mức khiến mình phải dừng công việc đang làm. Mình vẫn có thể đi làm, học tập và sinh hoạt bình thường, nên cũng không thực sự chú ý đến nó. Mình nghĩ có lẽ chỉ cần nghỉ ngơi một chút, rồi mọi chuyện sẽ ổn.","Nhưng tình trạng ấy không đơn giản biến mất. Dần dần, mình bắt đầu bị tê tay, cổ đau nhức nhiều hơn, có những lúc cảm giác khó chịu đến mức không thể ngủ ngon. Đến lúc ấy, mình mới thực sự lo lắng và phải đi khám, chụp MRI, tìm hiểu nguyên nhân cũng như cách tập luyện phù hợp để duy trì sức khỏe.","Nhìn lại, mình nhận ra rằng mình không hoàn toàn bỏ qua sức khỏe. Mình chỉ đợi đến khi cơ thể lên tiếng đủ lớn mới bắt đầu chú ý đến nó.","Nếu mình quan tâm đến những dấu hiệu ban đầu và chủ động tìm cách xử lý sớm hơn, có lẽ mình đã không phải trải qua một giai đoạn khó chịu đến vậy. Tất nhiên, không phải mọi vấn đề sức khỏe đều có thể ngăn ngừa bằng cách phát hiện sớm, nhưng trải nghiệm ấy khiến mình hiểu rằng việc chưa cảm thấy cấp bách không có nghĩa là mình không cần hành động.","Điều này không chỉ đúng với sức khỏe.","Ma trận Eisenhower phân chia công việc theo hai tiêu chí: mức độ quan trọng và tính cấp bách. Trong đó, nhóm công việc quan trọng nhưng chưa cấp bách thường là nhóm dễ bị bỏ quên nhất. Tại sao lại như vậy? Có lẽ vì những việc cấp bách luôn tạo ra áp lực ngay lập tức, trong khi hậu quả của việc bỏ bê những điều quan trọng thường chỉ xuất hiện sau một thời gian dài. Đó có thể là chăm sóc sức khỏe, học tập, xây dựng tài chính hay vun đắp các mối quan hệ. Chúng không đòi hỏi mình phải hành động ngay, nhưng lại âm thầm quyết định chất lượng cuộc sống về lâu dài.","Trong cuộc sống, có rất nhiều việc quan trọng nhưng chưa gấp. Mình biết mình cần học thêm một kỹ năng, xây dựng khoản tiết kiệm, quan tâm đến những mối quan hệ hay dành thời gian nghỉ ngơi. Nhưng vì những việc ấy chưa tạo ra hậu quả ngay lập tức, mình thường ưu tiên những việc đang chờ giải quyết trước mắt.","Mình nghĩ rằng mình vẫn còn thời gian.","Có thể ngày mai sẽ bắt đầu. Có thể đợi công việc bớt bận hơn. Có thể chờ đến khi điều kiện thuận lợi hơn.","Nhưng đôi khi, chính khoảng thời gian mình nghĩ rằng mình có thể trì hoãn lại là khoảng thời gian quý giá nhất để chủ động giải quyết vấn đề.","Những việc quan trọng nhưng không gấp sẽ không tự biến mất chỉ vì mình chưa chú ý đến chúng. Đôi khi, chúng chỉ đang chờ đến lúc trở nên đủ nghiêm trọng để buộc mình phải hành động."]},{"id":"tu-lai-suat-5-den-9-chuyen-gi-dang-xay-ra-voi-thi-truong-tien-te-viet-nam-mw1upwzw","topic":"Tài chính","series":"Lãi suất","date":"4 tháng 11, 2026","title":"Từ lãi suất 5% đến 9%: Chuyện gì đang xảy ra với thị trường tiền tệ Việt Nam?","excerpt":"Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–…","body":["Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–2024. Đến năm 2026, một số ngân hàng đã niêm yết mức 8–9%/năm ở những kỳ hạn từ 1 năm trở lên.","Vậy điều gì đã khiến lãi suất thay đổi đáng kể như vậy? Ai là người quyết định mức lãi suất ngân hàng? Và tại sao chúng ta không thể đơn giản yêu cầu các ngân hàng giảm lãi suất để việc vay tiền trở nên dễ dàng hơn? Bài viết này lần lượt đi qua ba câu hỏi đó.","**1. Nhìn lại thị trường năm 2023–2024**","Hãy nghĩ đến một quán ăn vắng khách. Chủ quán nghĩ đến việc giảm giá để kéo khách quay lại. Lãi suất giai đoạn 2023–2024 cũng có phần giống vậy. Nền kinh tế còn chịu ảnh hưởng từ những khó khăn sau đại dịch, hoạt động sản xuất, kinh doanh và thị trường bất động sản gặp nhiều thách thức, nên nhu cầu vay vốn ở một số lĩnh vực suy yếu. Khi ít người cần vay, ngân hàng sẵn sàng hạ “giá” của đồng tiền.","Sau những đợt điều chỉnh lãi suất điều hành của Ngân hàng Nhà nước trong năm 2023, các ngân hàng thương mại cũng từng bước hạ lãi suất huy động và cho vay, đưa mức huy động về quanh 5%/năm. Vay rẻ giúp doanh nghiệp dễ cân nhắc đầu tư hơn và giảm gánh nặng trả lãi cho người đang vay. Nhưng “giá rẻ” chỉ bền khi nguồn cung và nhu cầu về vốn còn cân bằng, và đó chính là điều đã thay đổi.","**2. Vì sao đến năm 2026, lãi suất lại chịu áp lực tăng?**","Cách dễ hình dung nhất là xem lãi suất như **giá của tiền**. Giống bất kỳ món hàng nào ở chợ, thứ gì nhiều người cần mà ít người có thì giá sẽ đắt lên. Năm 2026, tiền đang rơi vào đúng tình huống đó, vì ba lý do chính.","Lý do 1: Nhu cầu vay vốn tăng nhanh, trong khi tiền gửi vào chậm hơn","Trong 6 tháng đầu năm 2026, nhu cầu vốn của nền kinh tế tăng nhanh hơn khả năng huy động vốn của hệ thống ngân hàng. Theo số liệu được công bố tại họp báo của Ngân hàng Nhà nước (NHNN) ngày 2/7/2026, đến ngày 15/6, tín dụng tăng 6,38% so với đầu năm, trong khi huy động vốn chỉ tăng khoảng 4,3% — chênh lệch hơn 2 điểm phần trăm.","Điều này có nghĩa là dư nợ cho vay đang tăng nhanh hơn nguồn tiền gửi mà ngân hàng huy động được. Khi doanh nghiệp và người dân cần vốn nhiều hơn, trong khi tiền gửi không tăng tương ứng, các ngân hàng phải cạnh tranh để thu hút nguồn tiền nhàn rỗi bằng cách nâng lãi suất tiết kiệm. Thực tế, NHNN ghi nhận đến cuối tháng 6, tín dụng toàn hệ thống tăng 7,41% so với cuối năm 2025, trong khi huy động vốn chỉ tăng hơn 5%.","Nói cách khác, khi cầu vốn tăng nhanh hơn cung vốn, nguồn vốn trở nên khan hiếm tương đối và lãi suất huy động tăng chính là mức giá ngân hàng phải trả cao hơn để thu hút nguồn tiền còn lại trên thị trường.","### Lý do 2: Nhà nước cũng đang đi vay","Để xây đường, cầu và các công trình lớn, Nhà nước cần rất nhiều tiền. Một cách họ huy động là bán trái phiếu, hiểu đơn giản là “giấy vay nợ” của Nhà nước. Người mua chủ yếu là ngân hàng, công ty bảo hiểm và quỹ đầu tư, tức là những nơi cũng đang nắm giữ tiền của người dân. Theo VNDirect, kế hoạch huy động khoảng 500.000 tỷ đồng trái phiếu chính phủ trong năm 2026 sẽ tạo thêm sức ép lên mặt bằng lãi suất.","Hiện tượng này trong kinh tế học có tên là **hiệu ứng lấn át** (crowding out effect). Hãy tưởng tượng cả một khu phố cùng đi vay tiền từ một quỹ chung. Khi một người vay một khoản rất lớn, số tiền còn lại cho những người khác ít đi và họ phải trả giá cao hơn mới vay được. Ở đây, “người vay lớn” là Nhà nước, còn “những người còn lại” là doanh nghiệp và người dân. Khi nguồn tiền trong hệ thống ngân hàng bị chia sẻ cho nhiều nơi, các ngân hàng phải tăng lãi suất để giữ và thu hút tiền gửi.","Điều này không có nghĩa đầu tư công là xấu. Hạ tầng tốt giúp kinh tế phát triển về lâu dài. Chỉ là khi Nhà nước vay nhiều đúng lúc tiền trong hệ thống đang không dư dả, lãi suất chung sẽ bị kéo lên.","### Lý do 3: Ngân hàng không thể để lãi suất tiết kiệm quá thấp","Tiền luôn chảy về nơi có lãi cao hơn. Nếu lãi suất tiết kiệm bằng tiền VND quá thấp, nhiều người sẽ chuyển sang giữ USD hoặc đưa tiền vào các kênh khác như chứng khoán, vàng. Khi người dân có thêm lựa chọn hấp dẫn hơn, ngân hàng muốn giữ chân người gửi thì buộc phải đưa ra mức lãi suất đủ cạnh tranh. Nói cách khác, dù ai cũng mong lãi suất vay rẻ hơn, một ngân hàng không thể tự ý hạ lãi suất huy động quá thấp. Nếu làm vậy, tiền gửi sẽ chảy sang nơi khác, và họ không còn tiền để cho vay.","Cả ba yếu tố trên đều làm ngân hàng thương mại khó giảm lãi suất: cầu vốn lớn, nguồn vốn bị chia sẻ với Nhà nước, và áp lực phải giữ chân người gửi tiền. Không có một quyết định đơn lẻ nào đẩy lãi suất lên. Đó là kết quả của nhiều lực kéo cùng lúc.","Gần đây đã có dấu hiệu hạ nhiệt: theo một số báo cáo, sau chỉ đạo của Chính phủ, lãi suất tiết kiệm đã chững lại. Nhưng những áp lực gốc vẫn còn đó, nên chúng ta vẫn cần theo dõi thêm.","**3. Vậy ai quyết định lãi suất ngân hàng?**","Câu trả lời ngắn gọn là: không chỉ một bên. Có thể hình dung thành ba lớp.","Lớp thứ nhất là **Ngân hàng Nhà nước**, cơ quan điều hành chính sách tiền tệ. Cơ quan này dùng nhiều công cụ để tác động đến thanh khoản và mặt bằng lãi suất, đồng thời đặt trần cho lãi suất huy động ngắn hạn, ví dụ 4,75%/năm với kỳ hạn dưới 6 tháng.","Lớp thứ hai là **các ngân hàng thương mại**. Với kỳ hạn từ 6 tháng trở lên, mỗi ngân hàng tự định mức lãi suất trong khuôn khổ pháp luật, tùy vào nhu cầu vốn, chi phí và sức cạnh tranh của mình. Đó là lý do cùng một kỳ hạn nhưng mỗi nơi niêm yết một mức khác nhau.","Lớp thứ ba là **chính chúng ta, những người gửi tiền và người đi vay**. Người gửi chọn nơi trả cao hơn, người vay chọn nơi rẻ hơn. Những lựa chọn nhỏ ấy cộng lại và buộc ngân hàng phải điều chỉnh.","**4. Lãi suất huy động tăng có đồng nghĩa lãi suất cho vay sẽ tăng tương ứng?**","Lãi suất cho vay cũng đã tăng, thậm chí tăng nhiều hơn. Theo số liệu Ngân hàng Nhà nước công bố, lãi suất cho vay bình quân trong tháng 8/2026 đạt khoảng 10,7%/năm, cao hơn gần 2 điểm phần trăm so với cuối năm 2025. Trong khi đó, lãi suất tiền gửi bình quân của các giao dịch mới tăng 1,15 điểm phần trăm tính đến tháng 9. Hai số liệu thuộc hai tháng khác nhau nên chỉ nên xem là so sánh tương đối.","Nói cách khác, khoảng cách giữa lãi suất cho vay và lãi suất tiền gửi đã rộng thêm. Chi phí huy động tăng chưa phải là toàn bộ câu chuyện, vì lãi suất cho vay còn gồm chi phí hoạt động, rủi ro của khách hàng và sức cạnh tranh của từng ngân hàng. Khi chi phí vốn tăng, ngân hàng có thể nâng lãi suất cho vay, thu hẹp biên lợi nhuận hoặc kết hợp cả hai.","Điều người vay cần quan tâm không chỉ là lãi suất niêm yết, mà còn là lãi suất thực tế áp dụng cho khoản vay của mình, đặc biệt sau khi hết thời gian ưu đãi và chuyển sang lãi suất thả nổi.","**Kết luận**","Quay lại ba câu hỏi ở đầu bài. Điều gì khiến lãi suất tăng? Có ba lực kéo cùng lúc: người cần vay nhiều hơn người gửi tiền, Nhà nước cũng đang vay lớn và tạo ra hiệu ứng lấn át, và ngân hàng phải cạnh tranh để giữ người gửi trước các kênh khác như USD, chứng khoán, vàng. Ai là người quyết định? Ngân hàng Nhà nước đặt luật chơi chung, các ngân hàng thương mại tự định giá, và người gửi, người vay “bỏ phiếu” bằng lựa chọn của mình.","Còn vì sao không thể đơn giản yêu cầu ngân hàng giảm lãi suất? Vì lãi suất là giá của tiền, mà giá thì không thể hạ chỉ bằng mong muốn. Nếu ép lãi suất huy động xuống quá thấp khi tiền đang khan hiếm, người dân sẽ chuyển tiền sang nơi khác, ngân hàng thiếu nguồn vốn và người cần vay có thể còn khó vay hơn.","Và có lẽ, mỗi khi nghe tin lãi suất tăng hoặc giảm, thay vì chỉ hỏi “Điều này tốt hay xấu?”, chúng ta có thể bắt đầu bằng một câu hỏi khác: Vì sao lãi suất phải thay đổi ở thời điểm này, và sự thay đổi đó sẽ ảnh hưởng đến những ai?","Đó cũng là một cách để nhìn những tin tức kinh tế quen thuộc bằng một góc nhìn rộng hơn và là cách mình áp dụng những kiến thức tài chính để quan sát cuộc sống.","*Lưu ý: đây là ghi chép của một người đang học và tìm hiểu, không phải lời khuyên đầu tư hay tài chính.*","**Nguồn tham khảo**","Số liệu lãi suất bình quân và tăng trưởng tín dụng: theo công bố của Ngân hàng Nhà nước.","- [Ba yếu tố ảnh hưởng chi phí vay của Chính phủ năm 2026 – VnEconomy](https://vneconomy.vn/ba-yeu-to-anh-huong-chi-phi-vay-cua-chinh-phu-nam-2026.htm)\n- [Mở dư địa huy động vốn dài hạn qua kênh trái phiếu chính phủ – Thời báo Tài chính Việt Nam](https://thoibaotaichinhvietnam.vn/mo-du-dia-huy-dong-von-dai-han-qua-kenh-trai-phieu-chinh-phu-206168-206168.html)\n- [Mặt bằng lãi suất đã khác gì so với đầu năm – Tạp chí Kinh tế Tài chính](https://tapchikinhtetaichinh.vn/mat-bang-lai-suat-da-khac-gi-so-voi-dau-nam-159426.html)\n- [Dư địa nới lỏng thu hẹp, chính sách tiền tệ trước áp lực lãi suất và tỷ giá – Thị trường tài chính tiền tệ](https://thitruongtaichinhtiente.vn/print/77444.html)\n- [Tiền gửi ngân hàng tăng lên, lãi suất phát hành trái phiếu giảm nhiệt – Tin nhanh chứng khoán](https://www.tinnhanhchungkhoan.vn/tien-gui-ngan-hang-tang-len-lai-suat-phat-hanh-trai-phieu-giam-nhiet-post397023.html)"]},{"id":"thoi-quen-viet","topic":"Suy nghĩ","series":"","date":"28 tháng 10, 2026","title":"Vì sao mình bắt đầu viết mỗi ngày","excerpt":"Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được…","body":["Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được, một điều nhỏ nhặt xảy ra trong ngày, hay một ý tưởng đọc được ở đâu đó, mình lại có thêm những suy nghĩ muốn đào sâu. Mình thường tự đặt câu hỏi, thử nhìn một vấn đề từ nhiều góc độ và tìm cách lý giải nó theo cách hiểu của riêng mình.","Nhưng mình nhận ra, có những suy nghĩ cứ quanh quẩn mãi trong đầu mà chẳng đi đến đâu. Có những điều tưởng rằng đã hiểu, nhưng khi muốn diễn đạt lại thì mình vẫn chưa biết bắt đầu từ đâu. Vì vậy, mình muốn thử viết chúng ra, thay vì chỉ giữ chúng trong những cuộc đối thoại với chính mình.","Mình muốn ghi lại những điều mình quan sát, những câu hỏi mình còn băn khoăn và cả những điều mình dần nhận ra sau mỗi trải nghiệm. Không phải suy nghĩ nào cũng cần một câu trả lời, cũng không phải vấn đề nào cũng cần được giải quyết ngay. Đôi khi, chỉ cần viết xuống và nhìn nhận nó rõ ràng hơn, mình đã có thể hiểu bản thân thêm một chút.","Vì thế, mình muốn biến việc viết thành một cách để học hỏi. Để những điều mình đọc không chỉ dừng lại ở việc từng biết, mà dần trở thành kiến thức của riêng mình.","Và mình muốn, qua từng bài viết nhỏ, mình có thể hiểu thế giới rõ hơn một chút, hiểu bản thân sâu hơn một chút, và lưu giữ lại hành trình của chính mình.","Ngọc Hân - Những ngày còn trẻ"]}]</script>
<script>
var posts=JSON.parse(document.getElementById('data').textContent);
var canEdit=false,armed=null,app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'khac'}
function topics(){var r=[];posts.forEach(function(p){if(r.indexOf(p.topic)<0)r.push(p.topic)});return r}
function mins(p){return Math.max(1,Math.ceil(p.body.join(' ').split(/\s+/).length/200))}
function meta(p){return esc(p.date)+' · '+esc(p.topic)+' · Đọc trong '+mins(p)+' phút'}
function inl(s){s=esc(s);
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
 return s}
function fmt(body){return body.map(function(t){
 var m=t.match(/^(#{2,3})\s+([\s\S]*)$/);
 if(m)return m[1].length===2?'<h2 class="ph">'+inl(m[2])+'</h2>':'<h3 class="ph">'+inl(m[2])+'</h3>';
 if(/^[-•]\s/.test(t))return '<ul>'+t.split('\n').map(function(l){return '<li>'+inl(l.replace(/^[-•]\s+/,''))+'</li>'}).join('')+'</ul>';
 return '<p>'+inl(t).replace(/\n/g,'<br>')+'</p>'}).join('')}
function wrap(m){var t=document.getElementById('f-body'),a=t.selectionStart,b=t.selectionEnd,x=t.value,sel=x.slice(a,b),r,s1=null,e1=null;
 function pre(){var h=x.slice(0,a);return a===0||/\n\n$/.test(h)?'':(/\n$/.test(h)?'\n':'\n\n')}
 function post(){var h=x.slice(b);return h===''||/^\n\n/.test(h)?'':(/^\n/.test(h)?'\n':'\n\n')}
 if(m==='b')r='**'+(sel||'chữ đậm')+'**';
 else if(m==='i')r='*'+(sel||'chữ nghiêng')+'*';
 else if(m==='h')r=pre()+'## '+(sel||'Tiêu đề')+post();
 else if(m==='l')r=pre()+(sel||'mục 1\nmục 2').split('\n').map(function(l){return '- '+l.replace(/^[-•]\s+/,'')}).join('\n')+post();
 else if(m==='a'){r='['+(sel||'văn bản liên kết')+'](https://)';s1=a+r.length-9;e1=a+r.length-1}
 t.value=x.slice(0,a)+r+x.slice(b);t.focus();t.setSelectionRange(s1===null?a:s1,e1===null?a+r.length:e1)}
function initTb(){var bs=document.querySelectorAll('.tbtn');if(!bs.length)return;
 bs.forEach(function(b){b.onclick=function(){wrap(b.getAttribute('data-m'))}});
 document.getElementById('f-body').addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&!e.shiftKey){var k=e.key.toLowerCase();if(k==='b'||k==='i'){e.preventDefault();wrap(k)}}})}
function seriesList(t){var r=[];posts.forEach(function(p){if(p.series&&r.indexOf(p.series)<0&&(!t||slug(p.topic)===t))r.push(p.series)});return r}
function inSeries(s){return posts.filter(function(p){return p.series===s}).reverse()}
function tagsFor(f){var s=seriesList(f);return s.length?'<div class="chips">'+s.map(function(x){return '<a class="chip tag" href="#series-'+slug(x)+'">#'+esc(x)+'</a>'}).join('')+'</div>':''}
function badge(p){if(!p.series)return '';var l=inSeries(p.series);return '<div style="margin:12px 0 4px"><a class="chip tag" style="font:500 13px Inter,system-ui,sans-serif;padding:5px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--accent)" href="#series-'+slug(p.series)+'">#'+esc(p.series)+' · Phần '+(l.indexOf(p)+1)+'/'+l.length+'</a></div>'}
function seriesNav(p){if(!p.series)return '';var l=inSeries(p.series),i=l.indexOf(p),a=l[i-1],b=l[i+1];return '<div class="sn"><span>'+(a?'<a href="#'+a.id+'">← Phần '+i+': '+esc(a.title)+'</a>':'')+'</span><span style="text-align:right">'+(b?'<a href="#'+b.id+'">Phần '+(i+2)+': '+esc(b.title)+' →</a>':'')+'</span></div>'}
function seriesPage(sl){var name=seriesList().filter(function(x){return slug(x)===sl})[0];if(!name)return home();var l=inSeries(name);return '<div class="chips"><a class="chip" href="#">← Tất cả</a></div><article style="padding-bottom:0"><div class="meta">Series · '+l.length+' bài</div><h1>#'+esc(name)+'</h1></article>'+l.map(function(p,i){return '<a class="post" href="#'+p.id+'"><div class="meta">Phần '+(i+1)+' · '+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('')}
function today(){var d=new Date();return d.getDate()+' tháng '+(d.getMonth()+1)+', '+d.getFullYear()}
function home(f){
 var chips='<div class="chips"><a class="chip'+(f?'':' on')+'" href="#">Tất cả</a>'+topics().map(function(t){return '<a class="chip'+(slug(t)===f?' on':'')+'" href="#chu-de-'+slug(t)+'">'+esc(t)+'</a>'}).join('')+'</div>';
 var add=canEdit?'<div class="bar"><a class="btn" href="#viet-bai">+ Viết bài mới</a><button class="btn alt" id="dl">Tải về file HTML</button><span id="msg"></span></div>':'';
 return add+chips+tagsFor(f)+posts.filter(function(p){return !f||slug(p.topic)===f}).map(function(p){return '<a class="post" href="#'+p.id+'"><div class="meta">'+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('');
}
function about(){return '<article><h1>Xin chào, mình là…</h1><p>Đây là góc nhỏ để mình viết về cuộc sống thường ngày: những buổi sáng, những món ăn, những suy nghĩ vụn vặt.</p><p>Bạn hãy thay phần giới thiệu này bằng đôi dòng về chính bạn nhé.</p><a class="back" href="#">← Về trang chủ</a></article>'}
function editor(p){
 p=p||{title:'',topic:'',date:today(),excerpt:'',body:[]};
 return '<article><a class="back" href="#">← Hủy</a><h1>'+(p.id?'Sửa bài viết':'Viết bài mới')+'</h1>'
 +'<label>Tiêu đề</label><input id="f-title" value="'+esc(p.title)+'">'
 +'<label>Chủ đề (chọn chủ đề có sẵn hoặc gõ chủ đề mới)</label><input id="f-topic" list="tl" value="'+esc(p.topic)+'"><datalist id="tl">'+topics().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Series (tùy chọn, ví dụ Lãi suất; để trống nếu là bài lẻ)</label><input id="f-series" list="sl" value="'+esc(p.series||'')+'"><datalist id="sl">'+seriesList().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Ngày</label><input id="f-date" value="'+esc(p.date)+'">'
 +'<label>Mô tả ngắn (để trống thì tự lấy từ đoạn đầu)</label><input id="f-excerpt" value="'+esc(p.excerpt)+'">'
 +'<label>Nội dung (cách một dòng trống để sang đoạn mới)</label><div class="tb"><button class="tbtn" data-m="b"><b>B</b></button><button class="tbtn" data-m="i"><i>I</i></button><button class="tbtn" data-m="h">Tiêu đề</button><button class="tbtn" data-m="l">Danh sách</button><button class="tbtn" data-m="a">Liên kết</button></div><textarea id="f-body" rows="12">'+esc(p.body.join('\n\n'))+'</textarea>'
 +'<div class="hint">Chọn đoạn chữ rồi bấm nút. Cũng dùng được Ctrl+B (đậm) và Ctrl+I (nghiêng).</div><div class="bar"><button class="btn" id="save">Lưu và đăng</button><span id="msg"></span></div></article>';
}
function v(id){return document.getElementById(id).value}
function say(t){var m=document.getElementById('msg');if(m)m.textContent=t}
function save(id){
 var t=v('f-title').trim(),tp=v('f-topic').trim()||'Chung';
 var body=v('f-body').split(/\n\s*\n/).map(function(s){return s.trim()}).filter(Boolean);
 if(!t){say('Hãy nhập tiêu đề.');return}
 if(!body.length){say('Hãy nhập nội dung.');return}
 var ex=v('f-excerpt').trim()||body[0].slice(0,90)+(body[0].length>90?'…':'');
 var o={id:id||slug(t)+'-'+Date.now().toString(36),topic:tp,series:v('f-series').trim().replace(/^#/,''),date:v('f-date').trim()||today(),title:t,excerpt:ex,body:body};
 if(id)posts=posts.map(function(x){return x.id===id?o:x});else posts.unshift(o);
 commit('#'+o.id);
}
function commit(hash){
 say('Đang lưu…');
 claude.use('artifact').then(function(a){
  if(!a){say('Không lưu được ở đây.');return}
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');
  location.hash=hash;
  return a.publish('<!DOCTYPE html>\n'+c.outerHTML);
 }).catch(function(e){say('Lưu không được: '+((e&&e.message)||'lỗi'))});
}
function buildDoc(){var c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');return '<!DOCTYPE html>\n'+c.outerHTML}
function download(){claude.use('downloads').then(function(d){if(!d){say('Không tải được ở đây.');return}return d.save({filename:'index.html',data:buildDoc()})}).catch(function(e){if(!e||e.code!=='declined')say('Tải không được.')})}
function render(){
 var h=location.hash.replace('#',''),html='',on='n-home',p,bind=null;
 if(h==='gioi-thieu'){html=about();on='n-about'}
 else if(h.indexOf('chu-de-')===0){html=home(h.slice(7))}
 else if(h.indexOf('series-')===0){html=seriesPage(h.slice(7))}
 else if(h==='viet-bai'&&canEdit){html=editor();bind=function(){document.getElementById('save').onclick=function(){save(null)}}}
 else if(h.indexOf('sua-')===0&&canEdit&&(p=posts.filter(function(x){return x.id===h.slice(4)})[0])){html=editor(p);bind=function(){document.getElementById('save').onclick=function(){save(p.id)}}}
 else if((p=posts.filter(function(x){return x.id===h})[0])){
  var tools=canEdit?'<div class="bar"><a class="btn alt" href="#sua-'+p.id+'">Sửa bài</a><button class="btn alt" id="del">Xóa bài</button><span id="msg"></span></div>':'';
  html='<article><a class="back" href="#">← Tất cả bài viết</a><div class="meta" style="margin-top:22px">'+meta(p)+'</div>'+badge(p)+'<h1>'+esc(p.title)+'</h1>'+fmt(p.body)+seriesNav(p)+tools+'</article>';
  bind=function(){var d=document.getElementById('del');if(!d)return;d.onclick=function(){if(armed!==p.id){armed=p.id;d.textContent='Bấm lần nữa để xóa';return}posts=posts.filter(function(x){return x.id!==p.id});commit('#')}};
 } else html=home();
