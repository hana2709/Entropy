<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góc nhỏ của Hana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
:root{--bg:#faf6f0;--card:#fff;--text:#2b2622;--muted:#8a7f74;--accent:#c4623a;--line:#e8dfd3;--c0:#a8d8c8;--c1:#cdbbe8;--c2:#b3d1ee;--c3:#f0dca0;--c4:#f3bfd0;--c5:#c3d0d6;--c6:#a9dce6;--c7:#cfe0a3;--k0:#2f6b5c;--k1:#6a4c93;--k2:#34608f;--k3:#8a6410;--k4:#a04565;--k5:#53636b;--k6:#28707f;--k7:#5d7022;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c0:#a8d8c8;--c1:#cdbbe8;--c2:#b3d1ee;--c3:#f0dca0;--c4:#f3bfd0;--c5:#c3d0d6;--c6:#a9dce6;--c7:#cfe0a3;--k0:#8ed4be;--k1:#c5b0e6;--k2:#a6c8ee;--k3:#ecd48a;--k4:#f0adc4;--k5:#b6c6cd;--k6:#94d4e0;--k7:#c4d98f;--bg:#1c1917;--card:#26221f;--text:#efe7dd;--muted:#a1968a;--accent:#e58a63;--line:#3a342f;color-scheme:dark}}
:root[data-theme="dark"]{--c0:#a8d8c8;--c1:#cdbbe8;--c2:#b3d1ee;--c3:#f0dca0;--c4:#f3bfd0;--c5:#c3d0d6;--c6:#a9dce6;--c7:#cfe0a3;--k0:#8ed4be;--k1:#c5b0e6;--k2:#a6c8ee;--k3:#ecd48a;--k4:#f0adc4;--k5:#b6c6cd;--k6:#94d4e0;--k7:#c4d98f;--bg:#1c1917;--card:#26221f;--text:#efe7dd;--muted:#a1968a;--accent:#e58a63;--line:#3a342f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.75 'Lora',Georgia,serif}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
header{padding:56px 0 28px;border-bottom:1px solid var(--line)}
header h1{font-size:2.2rem;margin:0 0 6px;line-height:1.2}
header h1 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.45em}
.logo{width:1em;height:1em;flex:none;color:var(--accent)}
header p{margin:0;color:var(--muted);font-style:italic}
nav{display:flex;gap:18px;margin-top:20px;font:500 14px 'Inter',system-ui,sans-serif}
nav a{color:var(--muted);text-decoration:none;cursor:pointer}
nav a:hover,nav a.on{color:var(--accent)}
.post{display:block;padding:20px 22px;margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:inset 5px 0 0 var(--tc,transparent),0 1px 3px rgba(60,40,20,.06);text-decoration:none;color:inherit;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.post:hover{transform:translateY(-3px);box-shadow:inset 5px 0 0 var(--tc,transparent),0 8px 20px rgba(60,40,20,.12);border-color:var(--tc,var(--accent))}
.meta{font:13px 'Inter',system-ui,sans-serif;color:var(--muted);letter-spacing:.03em}
.post h2{margin:4px 0 6px;font-size:1.4rem;line-height:1.35}
.post:hover h2{color:var(--accent)}
.post p{margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0 4px;font:500 13px 'Inter',system-ui,sans-serif}
.chip{padding:5px 14px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--card)}
.chip:hover,.chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.tag{font-weight:500}
.sn{display:flex;justify-content:space-between;gap:16px;margin:30px 0 10px;font:14px 'Inter',system-ui,sans-serif}
.sn a{color:var(--accent);text-decoration:none}
.sn span{max-width:48%}
.ph{line-height:1.4;margin:1.7em 0 .6em}
h2.ph{font-size:1.4rem}
h3.ph{font-size:1.15rem}
article ul{padding-left:1.3em;margin:0 0 1.2em}
article li{margin:.3em 0}
article strong{font-weight:600}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tbtn{font:500 13px 'Inter',system-ui,sans-serif;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}

<script id="data" type="application/json">[{"id":"lai-suat-va-chu-ky-vat-long-cuu-khi-nguoi-vay-tien-phai-ban-tai-san-mw54t767","topic":"Chuyện tiền bạc","series":"Lãi suất","date":"6 tháng 11, 2026","title":"Lãi suất và chu kỳ vặt lông cừu: Khi người vay tiền phải bán tài sản","excerpt":"Có một chuyện khá thú vị khi nhìn vào thị trường bất động sản. Lúc giá nhà tăng, người mua…","body":["Có một chuyện khá thú vị khi nhìn vào thị trường bất động sản. Lúc giá nhà tăng, người mua nhà thường được xem là có tầm nhìn. Người vay được tiền ngân hàng, mua được căn nhà rồi bán lại với giá cao hơn có thể kiếm được một khoản lời đáng kể.","Nhưng khi lãi suất tăng, câu chuyện đôi khi lại rẽ sang hướng khác. Người từng vui mừng vì mua được nhà có thể bắt đầu lo lắng về khoản nợ mỗi tháng. Có người phải bán căn nhà mình đã dành dụm nhiều năm mới mua được, không phải vì họ không còn muốn giữ nó, mà vì họ không còn đủ tiền để giữ nữa.","Căn nhà vẫn ở đó. Vị trí không đổi, diện tích không đổi. Chỉ có chi phí để sở hữu nó là khác trước.","Và đôi khi, chính sự thay đổi tưởng như rất nhỏ ấy lại khiến tài sản chuyển từ tay người này sang tay người khác.","## 1. Khi tiền rẻ, ai cũng muốn mua tài sản","Thử tưởng tượng bạn đang muốn mua một căn hộ giá 3,8 tỷ đồng.","Bạn có sẵn 1,14 tỷ đồng (30% giá trị căn hộ), còn lại 2,66 tỷ đồng sẽ vay ngân hàng. Nếu chỉ nhìn vào giá căn hộ, có lẽ bạn sẽ nghĩ mình đã có một khoản vốn tương đối tốt. Ngân hàng cũng đang có gói vay ưu đãi, số tiền phải trả mỗi tháng nằm trong khả năng chi trả. Bạn bắt đầu tin rằng đây là thời điểm thích hợp để mua nhà.","Nếu tiếp tục thuê nhà, mỗi tháng bạn vẫn phải trả tiền thuê mà không sở hữu thêm tài sản nào. Còn nếu mua nhà, bạn vừa có chỗ ở ổn định, vừa có cơ hội hưởng lợi nếu giá nhà tăng trong tương lai.","Nghe cũng hợp lý, đúng không?","Đó là lý do vì sao khi lãi suất thấp, nhiều người sẵn sàng vay tiền để mua nhà, mua đất hoặc đầu tư. Tiền vay rẻ hơn khiến việc sở hữu tài sản trở nên dễ dàng hơn. Người chưa có đủ tiền vẫn có thể mua được nhà nhờ khoản vay ngân hàng.","Và nếu giá nhà tiếp tục tăng, người mua có thể thu được lợi nhuận lớn so với số vốn ban đầu.","Giả sử căn nhà 3,8 tỷ đồng tăng giá lên 4,3 tỷ đồng. Giá trị tài sản đã tăng 500 triệu đồng, trong khi số vốn ban đầu của bạn chỉ là 1,14 tỷ đồng. Nếu bỏ qua tiền lãi, thuế phí và các chi phí khác, khoản tăng giá ấy tương đương khoảng 44% số vốn tự có ban đầu.","Đây chính là sức hấp dẫn của đòn bẩy tài chính: bạn không cần có đủ tiền mua cả căn nhà nhưng vẫn được hưởng lợi nếu giá trị của nó tăng lên.","Tuy nhiên, có một điều chúng ta thường dễ quên khi thị trường đang thuận lợi: vay tiền có thể giúp mình mua được tài sản nhanh hơn, nhưng cũng khiến mình phụ thuộc nhiều hơn vào những gì xảy ra sau khi mua.","Khi giá nhà tăng, khoản vay có thể trông giống như một quyết định rất sáng suốt. Nhưng nếu điều kiện thị trường thay đổi, chính khoản vay ấy lại có thể trở thành gánh nặng.","## 2. Cái bẫy đôi khi nằm ở thời điểm hết ưu đãi lãi suất","Khi mua nhà, nhiều người thường quan tâm nhất đến lãi suất ngân hàng đưa ra tại thời điểm ký hợp đồng.","Chẳng hạn, ngân hàng có thể áp dụng lãi suất ưu đãi trong 6 tháng, 12 tháng hoặc 24 tháng đầu tiên. Với mức lãi suất thấp, số tiền phải trả hàng tháng có vẻ khá dễ chịu. Người mua tính toán thu nhập, chi phí sinh hoạt rồi thấy mình vẫn còn đủ tiền để trang trải cuộc sống.","Nhưng lãi suất ưu đãi không kéo dài mãi mãi.","Sau thời gian này, khoản vay có thể chuyển sang lãi suất thả nổi theo điều khoản đã ký. Nếu mặt bằng lãi suất tăng, số tiền lãi phải trả cũng tăng theo.","Theo các thông tin thị trường được công bố trong năm 2026, lãi suất vay mua nhà thả nổi tại Việt Nam có trường hợp phổ biến ở mức 13–15%/năm. Với người đang vay một khoản tiền lớn, đây không phải là sự thay đổi có thể dễ dàng bỏ qua.","Hãy quay lại căn hộ 3,8 tỷ đồng ở trên. Bạn vay ngân hàng 2,66 tỷ đồng. Nếu lấy dư nợ ban đầu để minh họa, tiền lãi ở mức 8%/năm vào khoảng 17,7 triệu đồng mỗi tháng. Nếu lãi suất tăng lên 14%/năm, con số này sẽ là khoảng 31 triệu đồng.","Chênh lệch hơn 13 triệu đồng mỗi tháng là một khoản tiền không nhỏ đối với nhiều gia đình. Đây mới chỉ là tiền lãi tính trên dư nợ ban đầu, chưa tính tiền gốc và việc dư nợ giảm dần; số tiền thực tế còn phụ thuộc vào hợp đồng vay.","Với một người có thu nhập cao, khoản tăng này có thể chưa phải vấn đề quá lớn. Nhưng với một gia đình đã dành phần lớn thu nhập để trả nợ, hơn 13 triệu đồng mỗi tháng có thể khiến mọi kế hoạch chi tiêu bị đảo lộn.","Tiền học của con, tiền sinh hoạt, tiền tiết kiệm dự phòng — tất cả đều phải tính lại.","Đáng nói là thu nhập của bạn không tự động tăng lên chỉ vì ngân hàng tăng lãi suất. Căn nhà cũng không chắc sẽ tăng giá để bạn bán đi và thu lại phần chênh lệch.","Thế là một tài sản từng khiến bạn cảm thấy yên tâm về tương lai lại bắt đầu trở thành nguồn áp lực.","Bạn vẫn có nhà, nhưng không còn thoải mái với số tiền mình kiếm được mỗi tháng. Bạn vẫn sở hữu tài sản, nhưng ngày càng ít tiền để dành. Và nếu tình trạng ấy kéo dài, việc bán nhà có thể dần trở thành lựa chọn duy nhất.","## 3. Khi người này phải bán nhà, người khác lại có cơ hội mua","Thử nhìn vào thị trường căn hộ Vinhomes Smart City.","Một tin rao ngày 29/10/2025 đưa ra mức giá 3,8 tỷ đồng cho căn hộ 1N+, diện tích 43 m² tại phân khu S106. Đến tháng 10/2026, một tin rao khác về căn hộ 43 m² tương tự tại dự án đưa ra mức giá 2,7 tỷ đồng.","Hai căn hộ này không phải cùng một căn, nên chúng ta không thể kết luận rằng giá của một căn hộ tương đương đã giảm từ 3,8 tỷ xuống 2,7 tỷ đồng. Giá rao còn phụ thuộc vào phân khu, tầng, hướng nhìn, nội thất và tình trạng pháp lý. Hơn nữa, giá rao không nhất thiết là giá giao dịch cuối cùng.","Nhưng những con số này gợi ra một câu hỏi đáng suy nghĩ: nếu thị trường không còn thuận lợi như trước, điều gì sẽ xảy ra với những người đã mua nhà bằng một khoản vay lớn?","Hãy hình dung có hai người cùng muốn mua một căn hộ.","Người thứ nhất đang vay ngân hàng. Lãi suất vừa tăng, thu nhập không thay đổi, tiền trả nợ mỗi tháng ngày càng nặng. Anh bắt đầu thấy mình không thể tiếp tục giữ căn nhà như kế hoạch ban đầu. Nếu không bán, anh sẽ phải tìm cách xoay thêm tiền. Nếu bán, anh có thể phải chấp nhận một mức giá thấp hơn kỳ vọng.","Người thứ hai có sẵn tiền mặt. Anh không cần mua ngay và cũng không phải lo khoản trả nợ ngân hàng mỗi tháng. Nếu căn hộ chưa đủ hấp dẫn, anh có thể tiếp tục chờ. Nếu người bán cần tiền gấp và sẵn sàng giảm giá, anh có thể cân nhắc xuống tiền.","Cùng đứng trước một căn nhà, nhưng hai người ở trong hai hoàn cảnh rất khác nhau.","Người thứ nhất muốn chờ giá tốt hơn cũng khó, bởi mỗi tháng trôi qua đều kéo theo chi phí vay. Người thứ hai có thể chờ thêm vài tháng mà không phải chịu áp lực tương tự.","Một người cần bán sớm. Người kia có thể thong thả lựa chọn.","Đó là lúc tiền mặt thể hiện giá trị của nó theo một cách khác. Tiền không chỉ giúp bạn mua được tài sản, mà còn giúp bạn có quyền chờ đợi.","## 4. Đó là cách một chu kỳ “vặt lông cừu” có thể diễn ra","Trong tài chính, cụm từ “vặt lông cừu” thường được dùng để mô tả tình huống những người ít có lợi thế về tiền bạc hoặc kinh nghiệm tài chính dần mất đi tài sản, trong khi những người có nguồn lực tốt hơn có thể tận dụng cơ hội để mua vào.","Nghe có vẻ giống như phải có ai đó đứng sau sắp đặt mọi chuyện. Nhưng thực tế, không phải lúc nào cũng cần một kế hoạch như vậy.","Đôi khi, chỉ cần thị trường vận hành theo một chu kỳ quen thuộc.","Khi lãi suất thấp, việc vay tiền trở nên dễ dàng hơn. Nhiều người mua tài sản vì tin rằng giá sẽ tiếp tục tăng. Càng nhiều người tham gia, giá tài sản càng có thể được đẩy lên cao. Những người mua sớm có thể kiếm được lợi nhuận, còn người mua sau chấp nhận bỏ ra nhiều tiền hơn vì sợ bỏ lỡ cơ hội.","Rồi điều kiện thay đổi. Lãi suất tăng, chi phí vay đắt hơn, người mua mới dè dặt hơn. Những người đã vay nhiều bắt đầu chịu áp lực trả nợ, trong khi giá tài sản không còn tăng nhanh như trước.","Nếu không đủ tiền dự phòng, họ có thể phải bán tài sản để giải quyết khoản nợ. Khi nhiều người cùng cần bán, một số người có thể phải chấp nhận mức giá thấp hơn mong muốn.","Và lúc này, những người có tiền mặt, ít nợ hoặc dòng tiền ổn định lại có nhiều lựa chọn hơn. Họ có thể chờ thị trường điều chỉnh rồi mua những tài sản mà trước đó họ chưa muốn mua vì giá quá cao.","Nhìn từ góc độ này, tài sản không nhất thiết biến mất khỏi nền kinh tế. Nó chỉ chuyển từ người đang gặp khó khăn về dòng tiền sang người có khả năng nắm giữ lâu dài hơn.","Điều đáng nói là người phải bán chưa chắc đã mua sai căn nhà. Có thể căn nhà vẫn tốt, vị trí vẫn đẹp và giá trị sử dụng vẫn còn nguyên. Nhưng họ không đủ khả năng chờ đến khi thị trường phục hồi.","Trong khi đó, người mua vào có thể không giỏi hơn, cũng không nhìn xa hơn. Họ chỉ có một lợi thế rất thực tế: họ không cần bán, và họ có đủ tiền để chờ người khác bán.","Tất nhiên, không phải cứ có tiền mặt là chắc chắn thắng, cũng không phải ai đi vay đều sẽ mất tài sản. Người có khoản vay hợp lý, thu nhập ổn định và tiền dự phòng vẫn có thể vượt qua giai đoạn lãi suất cao. Ngược lại, người có nhiều tiền nhưng mua tài sản sai thời điểm vẫn có thể thua lỗ.","Nhưng trong cùng một biến động của thị trường, người có ít áp lực tài chính thường có nhiều lựa chọn hơn người đang phải xoay xở từng tháng.","Và chính sự khác biệt ấy có thể khiến khoảng cách tài sản ngày càng lớn.","## 5. Điều quan trọng không chỉ là mua được tài sản, mà còn là giữ được nó","Khi nghĩ đến chuyện mua nhà, chúng ta thường đặt ra những câu hỏi rất quen thuộc: Giá căn hộ có tăng không? Khu vực này có tiềm năng không? Lãi suất ngân hàng đang ở mức bao nhiêu? Mỗi tháng phải trả bao nhiêu tiền?","Nhưng có lẽ còn một câu hỏi quan trọng không kém: nếu lãi suất tăng thêm vài điểm phần trăm, hoặc thu nhập giảm đi trong vài tháng, mình có còn đủ khả năng giữ căn nhà này không?","Câu hỏi ấy không nhằm khiến chúng ta sợ vay tiền. Vay vốn không phải lúc nào cũng xấu. Nếu có kế hoạch hợp lý, khoản vay có thể giúp một người mua được nhà sớm hơn, ổn định cuộc sống và tích lũy tài sản trong dài hạn.","Điều cần cân nhắc là mình đang dựa vào những giả định nào để đưa ra quyết định. Nếu mọi thứ diễn ra đúng như dự kiến, khoản vay có thể hoàn toàn nằm trong khả năng chi trả. Nhưng nếu lãi suất tăng, thu nhập giảm hoặc tài sản không thể bán ngay, liệu mình có còn đủ sức xoay xở?","Một căn nhà có thể là tài sản tốt trong dài hạn, nhưng vẫn trở thành gánh nặng nếu người sở hữu không đủ khả năng giữ nó qua một giai đoạn khó khăn.","Vì vậy, đôi khi điều quan trọng không phải là mua được căn nhà đắt nhất, hay tận dụng được khoản vay lớn nhất. Mà là giữ được quyền lựa chọn của mình, ngay cả khi thị trường không còn thuận lợi.","Bởi khi lãi suất thấp, chúng ta dễ nghĩ rằng mình đang kiểm soát được khoản vay. Nhưng khi lãi suất tăng, mới thấy rằng khoản vay cũng có thể kiểm soát lại cuộc sống của mình.","Và có lẽ đó mới là điều đáng suy nghĩ nhất về chu kỳ vặt lông cừu.","Không phải ai cũng mất tiền trong một chu kỳ lãi suất. Nhưng người không còn đủ tiền để chờ đợi thường phải chấp nhận những lựa chọn bất lợi hơn. Còn người có khả năng giữ tiền, giữ bình tĩnh và không bị buộc phải bán có thể kiên nhẫn chờ cơ hội xuất hiện."],"draft":false},{"id":"khi-lai-suat-thap-tien-se-chay-ve-dau-mw4h59r1","topic":"Chuyện tiền bạc","series":"Lãi suất","date":"6 tháng 11, 2026","title":"Khi lãi suất thấp, tiền sẽ chảy về đâu - Câu chuyện Việt Nam năm 2023-2024","excerpt":"Mình từng nghĩ lãi suất giảm là một tin tốt. Người vay tiền sẽ bớt áp lực trả lãi, doanh n…","body":["Mình từng nghĩ lãi suất giảm là một tin tốt. Người vay tiền sẽ bớt áp lực trả lãi, doanh nghiệp có thể vay vốn rẻ hơn để kinh doanh, còn nền kinh tế có thêm động lực phục hồi.","Nhưng có một câu hỏi ít được nhắc đến hơn: khi lãi suất trong nước giảm xuống, trong khi lãi suất ở một quốc gia khác vẫn cao, điều gì sẽ xảy ra với dòng tiền?","Tiền vốn không có lòng trung thành. Nó thường tìm đến nơi mà người nắm giữ tin rằng mình có thể kiếm được lợi nhuận tốt hơn, với mức rủi ro chấp nhận được. Và trong giai đoạn 2023–2024, Việt Nam đã phải đối mặt với một bài toán như vậy.","## 1. Khi gửi ngân hàng không còn hấp dẫn như trước","Giả sử bạn có 500 triệu đồng tiền nhàn rỗi. Đầu năm 2023, bạn gửi ngân hàng với lãi suất 8%/năm. Nếu giữ nguyên khoản tiền này trong một năm với mức lãi suất đó, bạn sẽ nhận được khoảng 40 triệu đồng tiền lãi.","Nhưng đến cuối năm, khi lãi suất tiền gửi kỳ hạn 12 tháng tại nhiều ngân hàng đã giảm về khoảng 4–5%/năm, khoản tiền lãi dự kiến chỉ còn 20–25 triệu đồng.","Cùng là 500 triệu đồng, cùng một ngân hàng, nhưng số tiền bạn nhận được đã giảm gần một nửa.","Đây không phải một ví dụ quá xa vời. Theo báo cáo của Hiệp hội Thị trường Trái phiếu Việt Nam (VBMA), lãi suất tiền gửi kỳ hạn 12 tháng đã giảm từ mức đỉnh khoảng 8%/năm vào đầu năm 2023 xuống còn khoảng 4–5%/năm vào cuối năm đó.","Tại sao lãi suất lại giảm mạnh như vậy?","Sau giai đoạn lãi suất tăng cao vào năm 2022, nền kinh tế Việt Nam bước vào một giai đoạn khó khăn. Xuất khẩu suy giảm, thị trường bất động sản trầm lắng, nhiều doanh nghiệp thiếu đơn hàng và gặp khó trong việc mở rộng sản xuất. Trong bối cảnh đó, Ngân hàng Nhà nước liên tiếp giảm lãi suất điều hành từ tháng 3 đến tháng 6/2023, với mục tiêu giảm chi phí vốn và hỗ trợ phục hồi kinh tế.","Lãi suất huy động giảm, kéo theo lãi suất cho vay mới dần hạ xuống. Đối với người đang vay mua nhà hoặc doanh nghiệp cần vốn lưu động, đây có thể là một tín hiệu tích cực.","Nhưng với người đang có tiền nhàn rỗi, câu chuyện lại khác.","Khi gửi tiết kiệm không còn đem lại mức sinh lời hấp dẫn như trước, họ bắt đầu cân nhắc những lựa chọn khác: mua vàng, đầu tư chứng khoán, tìm kiếm cơ hội ở bất động sản, hoặc đơn giản là giữ tiền chờ một cơ hội tốt hơn.","Và đây mới chỉ là câu chuyện trong nước.","## 2. Trong khi Việt Nam giảm lãi suất, Mỹ vẫn giữ lãi suất ở mức cao","Hãy thử đặt mình vào vị trí của một nhà đầu tư có khả năng nắm giữ tài sản bằng cả VNĐ và USD.","Tại Việt Nam, lãi suất tiền gửi giảm dần. Trong khi đó, Cục Dự trữ Liên bang Mỹ (Fed) vẫn duy trì lãi suất mục tiêu ở mức 5,25–5,50%/năm từ tháng 7/2023 đến tháng 9/2024.","Như vậy, trong một khoảng thời gian dài, lãi suất tại Mỹ vẫn ở mức cao, còn Việt Nam đã chuyển sang nới lỏng chính sách tiền tệ để hỗ trợ tăng trưởng.","Đặt hai con số cạnh nhau, người ta dễ nảy ra một câu hỏi: nếu có thể nắm giữ tài sản bằng USD với mức lợi suất hấp dẫn, tại sao phải tiếp tục nắm giữ toàn bộ tiền bằng đồng Việt Nam?","Tất nhiên, không thể chỉ nhìn vào lãi suất để quyết định. Một khoản đầu tư bằng USD còn chịu rủi ro tỷ giá, chi phí chuyển đổi, chi phí giao dịch và những biến động khác. Lợi suất cao hơn cũng không đồng nghĩa lợi nhuận cuối cùng chắc chắn cao hơn.","Tuy nhiên, khi chênh lệch lãi suất đủ lớn và đồng USD được kỳ vọng tiếp tục mạnh lên, việc nắm giữ tài sản bằng USD có thể trở nên hấp dẫn hơn.","Đây là điều đáng chú ý đối với dòng vốn quốc tế.","Theo báo cáo đánh giá kinh tế Việt Nam năm 2024, IMF cho biết tài khoản tài chính của Việt Nam suy giảm đáng kể trong năm 2023, một phần do dòng vốn ngắn hạn chảy ra nước ngoài. Việc các tổ chức tăng tiền gửi và đầu tư danh mục ở nước ngoài, trong bối cảnh chênh lệch lãi suất với Mỹ lớn, là một trong những yếu tố được IMF ghi nhận.","Điều này không có nghĩa người dân Việt Nam đồng loạt rút tiền khỏi ngân hàng để chuyển sang Mỹ. Dòng vốn quốc tế bao gồm nhiều loại giao dịch của ngân hàng, doanh nghiệp, nhà đầu tư và các tổ chức tài chính. Nhưng nó cho thấy một điều: **khi lợi suất trong nước giảm tương đối so với bên ngoài, Việt Nam có thể gặp khó khăn hơn trong việc giữ chân một phần dòng vốn ngắn hạn.**","## 3. Khi dòng tiền tìm đến USD, tỷ giá bắt đầu chịu sức ép","Đến đây, câu chuyện không còn chỉ liên quan đến việc một người gửi tiết kiệm kiếm được bao nhiêu tiền lãi mỗi năm.","Nó còn liên quan đến tỷ giá mà chúng ta nhìn thấy hàng ngày.","Giả sử một nhà đầu tư muốn rút vốn ra nước ngoài và cần mua USD. Nếu nhiều người cùng có nhu cầu như vậy, nhu cầu USD trên thị trường sẽ tăng lên. Nếu nguồn cung USD không tăng tương ứng, tỷ giá có thể chịu áp lực đi lên, tức cần nhiều đồng Việt Nam hơn để đổi lấy một USD.","Đây là một trong những yếu tố góp phần tạo áp lực lên tỷ giá USD/VND trong năm 2024.","Theo Ngân hàng Thế giới, tỷ giá USD/VND trên thị trường tăng từ khoảng 24.258 đồng/USD vào cuối tháng 12/2023 lên 25.334 đồng/USD vào cuối tháng 6/2024, tương đương mức tăng khoảng 4,4% của số đồng Việt Nam cần để mua một USD. Ngân hàng Thế giới cũng chỉ ra rằng chênh lệch lãi suất kéo dài và đồng USD mạnh lên đã góp phần thúc đẩy dòng vốn không được ghi nhận đầy đủ chảy ra ngoài.","Với người bình thường như chúng ta, tỷ giá tăng có thể chỉ được chú ý khi đi du lịch, mua hàng nhập khẩu hoặc thanh toán học phí ở nước ngoài. Nhưng với nền kinh tế, tác động rộng hơn nhiều.","Doanh nghiệp nhập khẩu phải bỏ ra nhiều tiền Việt Nam hơn để mua cùng một lượng USD thanh toán hàng hóa. Những doanh nghiệp và chính phủ có khoản vay bằng USD nhưng nguồn thu chủ yếu bằng đồng Việt Nam cũng có thể chịu thêm áp lực khi quy đổi nghĩa vụ trả nợ.","Chi phí nhập khẩu tăng còn có thể truyền sang giá bán trong nước, dù mức độ tác động phụ thuộc vào từng mặt hàng và khả năng hấp thụ chi phí của doanh nghiệp.","Vì vậy, một quyết định giảm lãi suất để hỗ trợ tăng trưởng trong nước đôi khi cũng phải tính đến những hệ quả ở thị trường ngoại hối.","## 4. Ngân hàng Nhà nước đứng trước một bài toán khó","Nếu tỷ giá chịu sức ép, tại sao Ngân hàng Nhà nước không đơn giản tăng lãi suất trở lại để khiến việc nắm giữ đồng Việt Nam hấp dẫn hơn?","Vấn đề là mỗi lựa chọn đều có cái giá của nó.","Nếu giữ lãi suất thấp, doanh nghiệp có thể tiếp tục được hưởng chi phí vay vốn dễ chịu hơn. Nhưng chênh lệch lợi suất với nước ngoài có thể duy trì áp lực lên tỷ giá và dòng vốn.","Nếu tăng lãi suất quá sớm hoặc quá mạnh, chi phí vay của doanh nghiệp và người dân có thể tăng lên. Một doanh nghiệp đang khó khăn vì đơn hàng yếu sẽ càng khó mở rộng sản xuất nếu phải trả lãi vay cao hơn. Người đang vay mua nhà cũng có thể chịu thêm áp lực tài chính.","Ngân hàng Nhà nước vì thế không thể chỉ nhìn vào một mục tiêu duy nhất. Cơ quan điều hành còn phải cân nhắc lạm phát, tăng trưởng tín dụng, thanh khoản của hệ thống ngân hàng, tỷ giá và diễn biến kinh tế quốc tế.","Trong năm 2024, áp lực ngoại hối đã khiến Ngân hàng Nhà nước phải sử dụng nhiều công cụ để ổn định thị trường. Theo IMF, dự trữ ngoại hối của Việt Nam giảm khoảng 9,2 tỷ USD trong năm 2024, xuống còn khoảng 83,1 tỷ USD vào cuối năm, tương đương khoảng 2.5 tháng nhập khẩu, thấp hơn mức dự trữ an toàn tối thiểu theo khuyến cáo là 3 tháng nhập khẩu.","Con số này không có nghĩa toàn bộ lượng dự trữ giảm đi đều được dùng để bù đắp cho dòng vốn rút ra. Dự trữ ngoại hối còn chịu ảnh hưởng bởi nhiều giao dịch và biến động khác. Nhưng nó cho thấy việc ổn định tỷ giá có thể đòi hỏi nguồn lực đáng kể.","Nói cách khác, lãi suất thấp giúp giải quyết một phần khó khăn của nền kinh tế, nhưng không khiến mọi vấn đề biến mất. Đôi khi, áp lực chỉ chuyển từ nơi này sang nơi khác.","## 5. Vậy có nên giữ lãi suất thấp?","Mình nghĩ câu trả lời không nằm ở việc lãi suất thấp hay cao tự thân tốt hơn, mà ở chỗ nền kinh tế đang cần điều gì và có đủ điều kiện để duy trì mức lãi suất đó hay không.","Nếu doanh nghiệp thiếu vốn vì chi phí vay quá cao, giảm lãi suất có thể giúp họ duy trì hoạt động, đầu tư và tạo việc làm. Nếu nền kinh tế đang suy yếu, việc giữ lãi suất cao chỉ để thu hút dòng vốn có thể khiến hoạt động kinh doanh trong nước thêm khó khăn.","Nhưng nếu lãi suất trong nước thấp hơn đáng kể so với bên ngoài trong thời gian dài, trong khi đồng USD mạnh lên, áp lực lên tỷ giá và dòng vốn có thể tăng. Khi đó, nhà điều hành phải tìm cách cân bằng giữa nhu cầu hỗ trợ kinh tế và yêu cầu ổn định thị trường ngoại hối.","Và còn một vấn đề khác: lãi suất thấp chỉ thực sự phát huy tác dụng khi người dân và doanh nghiệp muốn vay tiền để làm điều gì đó có ích cho nền kinh tế.","Nếu doanh nghiệp không nhìn thấy đầu ra, họ sẽ không muốn vay thêm chỉ vì lãi suất rẻ. Nếu người dân lo ngại thu nhập không ổn định, họ cũng chưa chắc sẵn sàng vay tiền để mua nhà hay tiêu dùng. Tiền rẻ là một điều kiện thuận lợi, nhưng không thể tự tạo ra cơ hội kinh doanh.","Cuối cùng, mình nghĩ câu chuyện lãi suất thấp ở Việt Nam giai đoạn 2023–2024 cho thấy một điều khá thú vị: tiền không chỉ quan tâm đến việc nó đang được trả lãi bao nhiêu, mà còn quan tâm đến nơi nó có thể sinh lời, mức độ an toàn và giá trị của đồng tiền trong tương lai.","Khi lãi suất giảm, chúng ta thường hỏi liệu doanh nghiệp có vay nhiều hơn hay người dân có chi tiêu nhiều hơn không. Nhưng đôi khi, một câu hỏi khác cũng quan trọng không kém là: nếu tiền có thể tìm thấy một lựa chọn hấp dẫn hơn ở nơi khác, điều gì sẽ khiến nó ở lại?","Bởi với một nền kinh tế, điều quan trọng không chỉ là làm cho đồng vốn trở nên rẻ hơn. Đó còn là tạo ra đủ niềm tin và cơ hội để đồng vốn ấy muốn ở lại, đi vào sản xuất, kinh doanh và tạo ra giá trị thực sự."],"draft":false},{"id":"khi-cuoc-song-qua-ap-luc-con-nguoi-co-can-mot-dam-me-de-theo-duoi-mw3o3qhx","topic":"Ngẫm một chút","series":"","date":"5 tháng 11, 2026","title":"Khi cuộc sống quá áp lực, con người có cần một đam mê để theo đuổi","excerpt":"Có bao giờ bạn cảm thấy mình đã rất cố gắng, nhưng vẫn không thể thực sự nghỉ ngơi?","body":["Có bao giờ bạn cảm thấy mình đã rất cố gắng, nhưng vẫn không thể thực sự nghỉ ngơi?","Công việc cần hoàn thành, những kỹ năng cần học thêm, tiền bạc cần tích lũy và một tương lai mà chúng ta luôn muốn chuẩn bị thật tốt. Ngay cả khi đã kết thúc một ngày làm việc, đầu óc vẫn tiếp tục nghĩ về những việc chưa làm xong, những mục tiêu chưa đạt được và những điều mình có thể đang bỏ lỡ.","Mình nghĩ áp lực của người trưởng thành đôi khi không đến từ một vấn đề quá lớn, mà từ việc có quá nhiều điều cần phải lo cùng một lúc. Chúng ta muốn làm tốt công việc, phát triển bản thân, có tài chính ổn định và xây dựng một cuộc sống như mong muốn. Mỗi điều đều hợp lý, nhưng khi tất cả cùng xuất hiện, chúng ta dễ quên mất rằng bản thân cũng cần được nghỉ ngơi.","**Khi cuộc sống chỉ còn những điều phải làm**","Mình từng có những khoảng thời gian gần như lấp đầy tất cả thời gian rảnh bằng các hoạt động khác nhau. Sau giờ làm là học cao học, học tiếng Anh, tìm hiểu Python và các công cụ AI. Nếu còn thời gian, mình có thể đi tập yoga, đạp xe hoặc tìm thêm một việc gì đó để làm.","Mình thực sự muốn học hỏi và phát triển bản thân. Nhưng đôi khi, nhìn vào những việc cần hoàn thành, mình nhận ra rằng ngay cả thời gian nghỉ ngơi cũng có thể trở thành một nhiệm vụ khác trong danh sách của mình.","Có lẽ chúng ta đã quen với việc luôn phải tiến về phía trước. Khi hoàn thành một mục tiêu, chúng ta lại nghĩ đến mục tiêu tiếp theo. Khi học được một kỹ năng, chúng ta bắt đầu lo lắng về những kỹ năng mình chưa có. Và khi có một buổi tối không làm được điều gì hữu ích, chúng ta thậm chí còn cảm thấy có lỗi.","Nhưng nếu cuộc sống chỉ xoay quanh những việc phải làm, đến bao giờ chúng ta mới có thể cảm thấy mình đã làm đủ?","Mình không nghĩ chúng ta cần từ bỏ tham vọng hay ngừng cố gắng. Chỉ là bên cạnh những điều giúp mình tiến lên, có lẽ chúng ta cũng cần một điều gì đó giúp mình phục hồi sau những ngày mệt mỏi.","**Chúng ta cần một điều gì đó để mong chờ**","Mình nghĩ đam mê không nhất thiết phải là một điều lớn lao. Nó không cần trở thành sự nghiệp, không nhất thiết phải mang lại thu nhập và cũng chẳng cần được người khác công nhận.","Đó có thể là một môn thể thao, một nhạc cụ, việc đọc sách, chăm sóc cây cối hay đơn giản là dành thời gian tìm hiểu một chủ đề mình tò mò.","Điều quan trọng là khi làm những việc ấy, chúng ta cảm thấy mình đang thực sự tận hưởng khoảng thời gian của bản thân, thay vì tiếp tục chạy theo một tiêu chuẩn nào đó.","Với mình, có những lúc đạp xe vì trời mát, uống một ly coldbrew vì thích hương vị cà phê, hay ngồi ở một quán quen vào cuối tuần đã đủ khiến một ngày trở nên dễ chịu hơn. Gần đây, mình cũng tìm thấy niềm vui trong việc viết và khám phá những chủ đề mình quan tâm. Có những ngày, điều mình mong chờ nhất đơn giản là được trở về, mở blog lên và hoàn thành một bài viết còn dang dở.","Những việc ấy không giải quyết được các vấn đề trong cuộc sống. Chúng không khiến công việc ít đi, không giúp mình hoàn thành mọi mục tiêu và cũng chẳng làm tương lai tự nhiên trở nên chắc chắn hơn. Nhưng chúng cho mình một điều để mong chờ, một khoảng thời gian mà mình được tự do suy nghĩ, tò mò và tận hưởng mà không cần phải chứng minh điều gì.","Có lẽ đó cũng là giá trị của một đam mê: không nhất thiết khiến cuộc sống của chúng ta tốt lên ngay lập tức, nhưng giúp những ngày bình thường trở nên đáng sống hơn.","**Đam mê không phải một mục tiêu khác cần hoàn thành**","Tuy nhiên, mình nghĩ có một điều chúng ta cần cẩn thận: đừng biến cả đam mê thành một áp lực mới.","Một sở thích có thể bắt đầu vì niềm vui, nhưng rồi chúng ta muốn phải giỏi hơn. Một môn thể thao ban đầu giúp thư giãn, nhưng sau đó lại trở thành một chỉ tiêu về sức khỏe. Một kỹ năng được học vì tò mò có thể nhanh chóng biến thành nỗi lo rằng mình chưa đủ tiến bộ.","Đến cuối cùng, ngay cả những thứ từng giúp chúng ta nghỉ ngơi cũng trở thành một phần trong danh sách những việc cần làm.","Mình đang học cách không lấp đầy tất cả những buổi tối và cuối tuần của mình. Có những ngày mình chỉ muốn ở nhà, không cần một kế hoạch đặc biệt nào. Có những lúc mình muốn nghỉ ngơi thay vì cố gắng học thêm một thứ mới. Và mình cũng muốn có thể làm một việc chỉ vì thích nó, mà không cần tự hỏi nó có ích gì cho tương lai hay không.","Mình nghĩ đam mê nên là một nơi để trở về, chứ không phải một tiêu chuẩn khác để đánh giá bản thân.","Chúng ta không cần phải viết thật hay, chơi một nhạc cụ thật giỏi hay đạt được thành tích đáng kể trong một môn thể thao mới có quyền tận hưởng những hoạt động ấy. Đôi khi, chỉ cần làm và cảm thấy vui đã là đủ.","**Sau cùng, chúng ta cũng cần được phục hồi**","Mình vẫn có những mục tiêu cần hoàn thành, những khoản tiền cần tiết kiệm và những kỹ năng muốn học hỏi. Cuộc sống vẫn còn rất nhiều điều phải lo, và một sở thích không thể khiến tất cả những áp lực ấy biến mất.","Nhưng mình bắt đầu hiểu rằng chúng ta không thể chỉ liên tục sử dụng năng lượng mà không tìm cách phục hồi nó. Đôi khi, điều cần thiết không phải là tìm thêm một mục tiêu để theo đuổi, mà là tìm một việc khiến mình muốn quay trở lại với cuộc sống sau những ngày mệt mỏi.","Đam mê có thể là một nơi như thế. Không phải nơi để trốn tránh thực tại, mà là nơi giúp chúng ta tạm rời khỏi những yêu cầu của cuộc sống, tận hưởng một điều mình yêu thích và lấy lại năng lượng để tiếp tục.","Và nếu hôm nay bạn vẫn chưa tìm thấy một đam mê như thế, có lẽ cũng không cần quá vội vàng. Nó không nhất thiết phải xuất hiện như một điều gì đó lớn lao. Đôi khi, nó chỉ bắt đầu từ một việc nhỏ mà bạn muốn làm thêm một lần nữa, rồi dần dần trở thành điều khiến bạn mong chờ mỗi ngày.","Sau cùng, mình nghĩ một cuộc sống tốt đẹp không chỉ là cuộc sống có đủ những điều để theo đuổi, mà còn là cuộc sống có đủ những điều giúp chúng ta hồi phục sau mỗi lần mệt mỏi.","Chúng ta không chỉ sống để làm việc, học hỏi, kiếm tiền và hoàn thành những mục tiêu đã đặt ra. Chúng ta còn cần những niềm vui nhỏ bé, những khoảng thời gian thuộc về riêng mình và một lý do để cảm thấy ngày hôm nay đáng sống, ngay cả khi chẳng có thành tựu nào đặc biệt."],"draft":false},{"id":"khung-hoang-tien-te-thai-lan-1997-mw3nf8pn","topic":"Chuyện tiền bạc","series":"Lãi suất","date":"5 tháng 11, 2026","title":"Lãi suất cao, dòng vốn ngoại và khủng hoảng tiền tệ Thái Lan 1997","excerpt":"Có một nghịch lý trong kinh tế: dòng vốn quốc tế có thể giúp một quốc gia tăng trưởng nhan…","body":["Có một nghịch lý trong kinh tế: dòng vốn quốc tế có thể giúp một quốc gia tăng trưởng nhanh chóng, nhưng cũng có thể trở thành nguồn cơn của một cuộc khủng hoảng khi dòng vốn ấy đột ngột đảo chiều.","Thái Lan đầu thập niên 1990 là một ví dụ rất rõ. Suốt nhiều năm, nền kinh tế này tăng trưởng trung bình khoảng 8–9% mỗi năm và được xem là một trong những “con hổ” năng động nhất châu Á. Vậy mà đến năm 1997, mọi thứ đảo chiều chỉ trong vài tháng: đồng Baht mất giá mạnh, doanh nghiệp vỡ nợ, và cơn địa chấn lan ra cả khu vực. Trong câu chuyện ấy, cái tên được nhắc đến nhiều nhất là George Soros, người thường bị gắn với cuộc tấn công vào đồng Baht.","Bài viết này lần lượt đi qua ba câu hỏi. Vì sao dòng vốn lại đổ vào Thái Lan nhiều đến vậy? Điều gì khiến mọi thứ đảo chiều? Và Soros thực sự đóng vai trò gì trong đó?","**1. Khi Thái Lan mở hai cánh cửa cùng lúc**","Ở bài trước mình đã nói lãi suất là giá của tiền. Vậy hãy tưởng tượng một khu chợ mà trước đây Nhà nước quy định giá từng mặt hàng, rồi một ngày người bán được tự định giá. Từ cuối thập niên 1980 đến đầu thập niên 1990, các mức trần đối với lãi suất huy động và cho vay lần lượt được dỡ bỏ, và đến khoảng năm 1992, quá trình tự do hóa lãi suất về cơ bản hoàn tất.","Mục tiêu nghe rất hợp lý, nhưng khi ngân hàng cạnh tranh nhau để thu hút tiền gửi, mặt bằng lãi suất cũng cao lên.","Cánh cửa thứ hai là vốn nước ngoài. Thái Lan nới lỏng quản lý ngoại hối, đồng thời lập Bangkok International Banking Facilities (BIBF) năm 1992, hoạt động từ năm 1993: một “đường ống” cho phép các ngân hàng vay vốn ở nước ngoài, chủ yếu bằng ngoại tệ, rồi cho vay lại trong nước.","**2. Vì sao dòng vốn đổ về Thái Lan?**","Có hai yếu tố khiến Thái Lan trở thành điểm đến hấp dẫn. Thứ nhất, lãi suất trong nước cao hơn đáng kể so với lãi suất USD. Thứ hai, đồng Baht được giữ ổn định quanh mức 25 Baht/USD suốt nhiều năm. Nói chính xác hơn, trước tháng 7/1997, Baht neo vào một rổ tiền tệ trong đó USD chiếm tỷ trọng rất lớn, nên trên thực tế nó gần như đứng yên so với đồng bạc xanh.","Giả sử bạn có thể vay tiền ở nơi lãi suất thấp, gửi sang nơi lãi suất cao hơn, mà còn tin giá trị đồng tiền gần như không đổi. Chênh lệch ấy trông như lợi nhuận “chắc chắn”. Các ngân hàng nước ngoài đã nghĩ như vậy, nên vốn đổ vào Thái Lan rất mạnh, trong đó một phần đáng kể là các khoản vay ngắn hạn bằng ngoại tệ.","Nguồn tiền dồi dào đẩy tín dụng và đầu tư lên nhanh, và bất động sản là nơi hút vốn nhiều nhất. Vòng xoáy lúc đó khá dễ hình dung: giá nhà tăng → tài sản thế chấp có giá trị hơn → ngân hàng cho vay thêm → tiền tiếp tục đổ vào bất động sản → giá nhà lại tăng.","Nhưng bên dưới sự nhộn nhịp ấy có hai “quả mìn hẹn giờ”.","**Quả mìn thứ nhất là chênh lệch kỳ hạn.** Vốn vay ngắn hạn lại được dùng cho những dự án dài hạn. Nó giống như bạn vay thẻ tín dụng trả trong vài tháng để mua một căn nhà mà phải mười năm mới thu hồi vốn.","**Quả mìn thứ hai là chênh lệch tiền tệ** (currency mismatch). Hãy hình dung bạn nhận lương bằng đồng, nhưng tiền trả góp nhà lại tính bằng USD. Một doanh nghiệp vay 1 triệu USD khi tỷ giá là 25 Baht/USD thì khoản nợ tương đương 25 triệu Baht. Nếu Baht mất giá và tỷ giá lên 40 Baht/USD, khoản nợ ấy thành 40 triệu Baht, dù doanh nghiệp không vay thêm một đồng nào.","**3. Những vết nứt xuất hiện từ năm 1996**","Đến năm 1996, các dấu hiệu bất ổn không còn che giấu được. Xuất khẩu, vốn là động lực của nền kinh tế, gần như đi ngang: USD mạnh lên khiến Baht gắn chặt với USD trở nên đắt hơn so với đồng yên, hàng thâm dụng lao động chịu sức ép cạnh tranh từ Trung Quốc, và giá chip điện tử giảm mạnh.","Cùng lúc, thâm hụt tài khoản vãng lai ở mức khoảng 8% GDP. Hiểu đơn giản, cả nền kinh tế đang tiêu và đầu tư nhiều hơn số tiền mình làm ra, và phần thiếu được bù bằng vốn vay nước ngoài.","Thị trường bất động sản thì đã dư cung: nhiều tòa nhà xây xong không có người thuê, nợ xấu tăng lên. Tháng 2/1997, Somprasong Land, một công ty bất động sản lớn, không trả được lãi trái phiếu quốc tế, và đến cuối tháng 6/1997, Ngân hàng Trung ương Thái Lan phải đình chỉ hoạt động của 16 công ty tài chính.","**4. George Soros, cuộc tấn công vào đồng Baht và ngày 2/7/1997**","Khi niềm tin suy giảm, nhiều nhà đầu tư bắt đầu đặt cược rằng Baht không thể giữ nguyên giá. Họ vay Baht (hoặc bán Baht kỳ hạn), đổi sang USD, và chờ Baht mất giá để mua lại rẻ hơn, giữ phần chênh lệch. Đây là hình thức **tấn công tiền tệ (currency attack)**.","Áp lực xuất hiện từ cuối năm 1996, mạnh dần vào đầu năm 1997 và lên đỉnh vào giữa tháng 5/1997. Lúc này Ngân hàng Trung ương Thái Lan giống như một cửa hàng đã hứa bán USD với giá cố định cho tất cả mọi người. Khi ai cũng đổ xô tới mua, kho hàng cạn dần.","Để câu giờ, họ trước hết dùng USD mua Baht, không chỉ trên thị trường giao ngay mà còn qua các hợp đồng kỳ hạn bán USD. Cách này giúp con số dự trữ công bố vẫn trông lớn, nhưng phần lớn đã có người “đặt trước”, như một cái kho ghi đầy hàng nhưng thực ra đã được hẹn bán gần hết. Đến cuối tháng 6/1997, các cam kết này vào khoảng 23–24 tỷ USD, ăn mòn gần hết phần dự trữ thực sự còn dùng được.","Tiếp đó, họ hạn chế cho nước ngoài vay Baht và để lãi suất ngắn hạn tăng vọt, để việc bán khống Baht trở nên đắt đỏ. Biện pháp này có tác dụng tạm thời, nhưng giống như cho bệnh nhân uống thuốc mạnh khi cơ thể đã yếu: lãi suất cao gây thêm khó khăn cho những doanh nghiệp và ngân hàng vốn đã loạng choạng.","Vậy Soros nằm ở đâu? George Soros nhìn thấy những điểm yếu của nền kinh tế Thái Lan: thâm hụt tài khoản vãng lai kéo dài, nợ nước ngoài tăng cao và đồng Baht được neo vào USD dù ngày càng mất sức cạnh tranh. Ông cùng quỹ Quantum Fund - một quỹ đầu cơ tiền tệ đặt cược rằng đồng Baht sớm muộn cũng phải phá giá. Trong khi Soros và các nhà đầu cơ bán Baht, mua USD, Ngân hàng Trung ương Thái Lan liên tục tung USD ra thị trường để mua lại Baht, cố giữ tỷ giá. Nhưng dự trữ ngoại hối không phải vô hạn. Càng bảo vệ tỷ giá, Thái Lan càng tiêu hao nguồn lực để chống đỡ áp lực thị trường. Ngày 2/7/1997, nước này buộc phải thả nổi đồng Baht, khiến đồng tiền lao dốc. Đến đầu năm 1998, có lúc tỷ giá lên quanh 56 Baht/USD, tức hơn gấp đôi so với mức 25 Baht/USD trước đó.","**5. Những bài học từ Thái Lan**","Nhìn lại, mình rút ra bốn điều.","**Thứ nhất, tự do hóa cần đi cùng năng lực quản lý rủi ro.** Nếu ngân hàng chạy theo quy mô mà không thẩm định kỹ khả năng trả nợ, và cơ quan giám sát không theo kịp tốc độ tăng tín dụng, rủi ro sẽ âm thầm tích tụ.","**Thứ hai, vốn nước ngoài không phải lúc nào cũng ở lại.** Vốn có thể rút đi đột ngột khi niềm tin thay đổi, và vốn vay ngắn hạn bằng ngoại tệ là loại dễ gây tổn thương nhất, nhất là khi bị dùng cho dự án dài hạn và tạo ra doanh thu bằng nội tệ.","**Thứ ba, không thể có tất cả cùng một lúc.** Thái Lan khi đó muốn giữ tỷ giá cố định, cho vốn tự do ra vào, và dùng lãi suất theo nhu cầu trong nước. Lý thuyết kinh tế gọi đây là “bộ ba bất khả thi”, giống như ba người cùng đắp một chiếc chăn quá hẹp: kéo bên này thì hở bên kia.","**Thứ tư, minh bạch cũng là một phần của sự ổn định.** Khi dự trữ thực chất đã bị các hợp đồng kỳ hạn “trói” lại mà thị trường không nắm đầy đủ, niềm tin sụp đổ rất nhanh khi sự thật lộ ra.","**Kết luận**","Quay lại ba câu hỏi ở đầu bài. Vốn đổ vào Thái Lan vì lãi suất cao, tỷ giá gần như cố định và hai cánh cửa tài chính mở cùng lúc. Mọi thứ đảo chiều khi xuất khẩu yếu, bất động sản dư cung, còn những khoản nợ ngoại tệ ngắn hạn thì quá sức nền kinh tế. Còn Soros là giọt nước cuối cùng làm tràn ly.","Ở bài trước, chúng ta đã thấy lãi suất ở Việt Nam đang tăng lên vì nhiều lực kéo cùng lúc. Lãi suất cao tự nó không phải là vấn đề. Điều đáng học là những câu hỏi mà người ta đã không đặt ra đủ sớm: tiền này vay từ đâu, vay bằng đồng tiền nào, và được dùng vào việc gì?"],"draft":false},{"draft":true,"id":"ap-luc-nguon-goc-sau-xa-cua-dong-luc-mw3emj08","topic":"Ngẫm một chút","series":"","date":"5 tháng 11, 2026","title":"Áp lực: Nguồn gốc sâu xa của động lực","excerpt":"Chúng ta học được cách tự tạo động lực bằng việc nghĩ đến tương lai tươi sáng. Nhưng nếu c…","body":["Chúng ta học được cách tự tạo động lực bằng việc nghĩ đến tương lai tươi sáng. Nhưng nếu chúng ta không có áp lực bắt buộc phải tốt, thì liệu nó có thể trở thành động lực được không"]},{"id":"nhung-viec-quan-trong-nhung-khong-gap-cai-gia-cua-viec-luon-de-ngay-mai-mw2abv5c","topic":"Ngẫm một chút","series":"","date":"4 tháng 11, 2026","title":"Những việc quan trọng nhưng không gấp: Cái giá của việc luôn để ngày mai","excerpt":"Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần …","body":["Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần dành quá nhiều sự quan tâm cho nó. Mình có thể tạm gác nó sang một bên, tiếp tục giải quyết những việc đang cần ưu tiên trước mắt và quay lại xử lý khi có nhiều thời gian hơn.","Cho đến khi mình nhận ra rằng không phải vấn đề nào cũng chờ mình sẵn sàng mới trở nên nghiêm trọng.","Trước đây, mình từng có những dấu hiệu mỏi cổ. Cảm giác ấy không quá nghiêm trọng đến mức khiến mình phải dừng công việc đang làm. Mình vẫn có thể đi làm, học tập và sinh hoạt bình thường, nên cũng không thực sự chú ý đến nó. Mình nghĩ có lẽ chỉ cần nghỉ ngơi một chút, rồi mọi chuyện sẽ ổn.","Nhưng tình trạng ấy không đơn giản biến mất. Dần dần, mình bắt đầu bị tê tay, cổ đau nhức nhiều hơn, có những lúc cảm giác khó chịu đến mức không thể ngủ ngon. Đến lúc ấy, mình mới thực sự lo lắng và phải đi khám, chụp MRI, tìm hiểu nguyên nhân cũng như cách tập luyện phù hợp để duy trì sức khỏe.","Nhìn lại, mình nhận ra rằng mình không hoàn toàn bỏ qua sức khỏe. Mình chỉ đợi đến khi cơ thể lên tiếng đủ lớn mới bắt đầu chú ý đến nó.","Nếu mình quan tâm đến những dấu hiệu ban đầu và chủ động tìm cách xử lý sớm hơn, có lẽ mình đã không phải trải qua một giai đoạn khó chịu đến vậy. Tất nhiên, không phải mọi vấn đề sức khỏe đều có thể ngăn ngừa bằng cách phát hiện sớm, nhưng trải nghiệm ấy khiến mình hiểu rằng việc chưa cảm thấy cấp bách không có nghĩa là mình không cần hành động.","Điều này không chỉ đúng với sức khỏe.","Ma trận Eisenhower phân chia công việc theo hai tiêu chí: mức độ quan trọng và tính cấp bách. Trong đó, nhóm công việc quan trọng nhưng chưa cấp bách thường là nhóm dễ bị bỏ quên nhất. Tại sao lại như vậy? Có lẽ vì những việc cấp bách luôn tạo ra áp lực ngay lập tức, trong khi hậu quả của việc bỏ bê những điều quan trọng thường chỉ xuất hiện sau một thời gian dài. Đó có thể là chăm sóc sức khỏe, học tập, xây dựng tài chính hay vun đắp các mối quan hệ. Chúng không đòi hỏi mình phải hành động ngay, nhưng lại âm thầm quyết định chất lượng cuộc sống về lâu dài.","Trong cuộc sống, có rất nhiều việc quan trọng nhưng chưa gấp. Mình biết mình cần học thêm một kỹ năng, xây dựng khoản tiết kiệm, quan tâm đến những mối quan hệ hay dành thời gian nghỉ ngơi. Nhưng vì những việc ấy chưa tạo ra hậu quả ngay lập tức, mình thường ưu tiên những việc đang chờ giải quyết trước mắt.","Mình nghĩ rằng mình vẫn còn thời gian.","Có thể ngày mai sẽ bắt đầu. Có thể đợi công việc bớt bận hơn. Có thể chờ đến khi điều kiện thuận lợi hơn.","Nhưng đôi khi, chính khoảng thời gian mình nghĩ rằng mình có thể trì hoãn lại là khoảng thời gian quý giá nhất để chủ động giải quyết vấn đề.","Những việc quan trọng nhưng không gấp sẽ không tự biến mất chỉ vì mình chưa chú ý đến chúng. Đôi khi, chúng chỉ đang chờ đến lúc trở nên đủ nghiêm trọng để buộc mình phải hành động."]},{"id":"tu-lai-suat-5-den-9-chuyen-gi-dang-xay-ra-voi-thi-truong-tien-te-viet-nam-mw1upwzw","topic":"Chuyện tiền bạc","series":"Lãi suất","date":"4 tháng 11, 2026","title":"Từ lãi suất 5% đến 9%: Chuyện gì đang xảy ra với thị trường tiền tệ Việt Nam?","excerpt":"Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–…","body":["Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–2024. Đến năm 2026, một số ngân hàng đã niêm yết mức 8–9%/năm ở những kỳ hạn từ 1 năm trở lên.","Vậy điều gì đã khiến lãi suất thay đổi đáng kể như vậy? Ai là người quyết định mức lãi suất ngân hàng? Và tại sao chúng ta không thể đơn giản yêu cầu các ngân hàng giảm lãi suất để việc vay tiền trở nên dễ dàng hơn? Bài viết này lần lượt đi qua ba câu hỏi đó.","**1. Nhìn lại thị trường năm 2023–2024**","Hãy nghĩ đến một quán ăn vắng khách. Chủ quán nghĩ đến việc giảm giá để kéo khách quay lại. Lãi suất giai đoạn 2023–2024 cũng có phần giống vậy. Nền kinh tế còn chịu ảnh hưởng từ những khó khăn sau đại dịch, hoạt động sản xuất, kinh doanh và thị trường bất động sản gặp nhiều thách thức, nên nhu cầu vay vốn ở một số lĩnh vực suy yếu. Khi ít người cần vay, ngân hàng sẵn sàng hạ “giá” của đồng tiền.","Sau những đợt điều chỉnh lãi suất điều hành của Ngân hàng Nhà nước trong năm 2023, các ngân hàng thương mại cũng từng bước hạ lãi suất huy động và cho vay, đưa mức huy động về quanh 5%/năm. Vay rẻ giúp doanh nghiệp dễ cân nhắc đầu tư hơn và giảm gánh nặng trả lãi cho người đang vay. Nhưng “giá rẻ” chỉ bền khi nguồn cung và nhu cầu về vốn còn cân bằng, và đó chính là điều đã thay đổi.","**2. Vì sao đến năm 2026, lãi suất lại chịu áp lực tăng?**","Cách dễ hình dung nhất là xem lãi suất như **giá của tiền**. Giống bất kỳ món hàng nào ở chợ, thứ gì nhiều người cần mà ít người có thì giá sẽ đắt lên. Năm 2026, tiền đang rơi vào đúng tình huống đó, vì ba lý do chính.","**Lý do 1: Nhu cầu vay vốn tăng nhanh, trong khi tiền gửi vào chậm hơn**","Trong 6 tháng đầu năm 2026, nhu cầu vốn của nền kinh tế tăng nhanh hơn khả năng huy động vốn của hệ thống ngân hàng. Theo số liệu được công bố tại họp báo của Ngân hàng Nhà nước (NHNN) ngày 2/7/2026, đến ngày 15/6, tín dụng tăng 6,38% so với đầu năm, trong khi huy động vốn chỉ tăng khoảng 4,3% — chênh lệch hơn 2 điểm phần trăm.","Điều này có nghĩa là dư nợ cho vay đang tăng nhanh hơn nguồn tiền gửi mà ngân hàng huy động được. Khi doanh nghiệp và người dân cần vốn nhiều hơn, trong khi tiền gửi không tăng tương ứng, các ngân hàng phải cạnh tranh để thu hút nguồn tiền nhàn rỗi bằng cách nâng lãi suất tiết kiệm. Thực tế, NHNN ghi nhận đến cuối tháng 6, tín dụng toàn hệ thống tăng 7,41% so với cuối năm 2025, trong khi huy động vốn chỉ tăng hơn 5%.","Nói cách khác, khi cầu vốn tăng nhanh hơn cung vốn, nguồn vốn trở nên khan hiếm tương đối và lãi suất huy động tăng chính là mức giá ngân hàng phải trả cao hơn để thu hút nguồn tiền còn lại trên thị trường.","### Lý do 2: Nhà nước cũng đang đi vay","Để xây đường, cầu và các công trình lớn, Nhà nước cần rất nhiều tiền. Một cách họ huy động là bán trái phiếu, hiểu đơn giản là “giấy vay nợ” của Nhà nước. Người mua chủ yếu là ngân hàng, công ty bảo hiểm và quỹ đầu tư, tức là những nơi cũng đang nắm giữ tiền của người dân. Theo VNDirect, kế hoạch huy động khoảng 500.000 tỷ đồng trái phiếu chính phủ trong năm 2026 sẽ tạo thêm sức ép lên mặt bằng lãi suất.","Hiện tượng này trong kinh tế học có tên là **hiệu ứng lấn át** (crowding out effect). Hãy tưởng tượng cả một khu phố cùng đi vay tiền từ một quỹ chung. Khi một người vay một khoản rất lớn, số tiền còn lại cho những người khác ít đi và họ phải trả giá cao hơn mới vay được. Ở đây, “người vay lớn” là Nhà nước, còn “những người còn lại” là doanh nghiệp và người dân. Khi nguồn tiền trong hệ thống ngân hàng bị chia sẻ cho nhiều nơi, các ngân hàng phải tăng lãi suất để giữ và thu hút tiền gửi.","Điều này không có nghĩa đầu tư công là xấu. Hạ tầng tốt giúp kinh tế phát triển về lâu dài. Chỉ là khi Nhà nước vay nhiều đúng lúc tiền trong hệ thống đang không dư dả, lãi suất chung sẽ bị kéo lên.","### Lý do 3: Ngân hàng không thể để lãi suất tiết kiệm quá thấp","Tiền luôn chảy về nơi có lãi cao hơn. Nếu lãi suất tiết kiệm bằng tiền VND quá thấp, nhiều người sẽ chuyển sang giữ USD hoặc đưa tiền vào các kênh khác như chứng khoán, vàng. Khi người dân có thêm lựa chọn hấp dẫn hơn, ngân hàng muốn giữ chân người gửi thì buộc phải đưa ra mức lãi suất đủ cạnh tranh. Nói cách khác, dù ai cũng mong lãi suất vay rẻ hơn, một ngân hàng không thể tự ý hạ lãi suất huy động quá thấp. Nếu làm vậy, tiền gửi sẽ chảy sang nơi khác, và họ không còn tiền để cho vay.","Cả ba yếu tố trên đều làm ngân hàng thương mại khó giảm lãi suất: cầu vốn lớn, nguồn vốn bị chia sẻ với Nhà nước, và áp lực phải giữ chân người gửi tiền. Không có một quyết định đơn lẻ nào đẩy lãi suất lên. Đó là kết quả của nhiều lực kéo cùng lúc.","Gần đây đã có dấu hiệu hạ nhiệt: theo một số báo cáo, sau chỉ đạo của Chính phủ, lãi suất tiết kiệm đã chững lại. Nhưng những áp lực gốc vẫn còn đó, nên chúng ta vẫn cần theo dõi thêm.","**3. Vậy ai quyết định lãi suất ngân hàng?**","Câu trả lời ngắn gọn là: không chỉ một bên. Có thể hình dung thành ba lớp.","Lớp thứ nhất là **Ngân hàng Nhà nước**, cơ quan điều hành chính sách tiền tệ. Cơ quan này dùng nhiều công cụ để tác động đến thanh khoản và mặt bằng lãi suất, đồng thời đặt trần cho lãi suất huy động ngắn hạn, ví dụ 4,75%/năm với kỳ hạn dưới 6 tháng.","Lớp thứ hai là **các ngân hàng thương mại**. Với kỳ hạn từ 6 tháng trở lên, mỗi ngân hàng tự định mức lãi suất trong khuôn khổ pháp luật, tùy vào nhu cầu vốn, chi phí và sức cạnh tranh của mình. Đó là lý do cùng một kỳ hạn nhưng mỗi nơi niêm yết một mức khác nhau.","Lớp thứ ba là **chính chúng ta, những người gửi tiền và người đi vay**. Người gửi chọn nơi trả cao hơn, người vay chọn nơi rẻ hơn. Những lựa chọn nhỏ ấy cộng lại và buộc ngân hàng phải điều chỉnh.","**4. Lãi suất huy động tăng có đồng nghĩa lãi suất cho vay sẽ tăng tương ứng?**","Lãi suất cho vay cũng đã tăng, thậm chí tăng nhiều hơn. Theo số liệu Ngân hàng Nhà nước công bố, lãi suất cho vay bình quân trong tháng 8/2026 đạt khoảng 10,7%/năm, cao hơn gần 2 điểm phần trăm so với cuối năm 2025. Trong khi đó, lãi suất tiền gửi bình quân của các giao dịch mới tăng 1,15 điểm phần trăm tính đến tháng 9. Hai số liệu thuộc hai tháng khác nhau nên chỉ nên xem là so sánh tương đối.","Nói cách khác, khoảng cách giữa lãi suất cho vay và lãi suất tiền gửi đã rộng thêm. Chi phí huy động tăng chưa phải là toàn bộ câu chuyện, vì lãi suất cho vay còn gồm chi phí hoạt động, rủi ro của khách hàng và sức cạnh tranh của từng ngân hàng. Khi chi phí vốn tăng, ngân hàng có thể nâng lãi suất cho vay, thu hẹp biên lợi nhuận hoặc kết hợp cả hai.","Điều người vay cần quan tâm không chỉ là lãi suất niêm yết, mà còn là lãi suất thực tế áp dụng cho khoản vay của mình, đặc biệt sau khi hết thời gian ưu đãi và chuyển sang lãi suất thả nổi.","**Kết luận**","Quay lại ba câu hỏi ở đầu bài. Điều gì khiến lãi suất tăng? Có ba lực kéo cùng lúc: người cần vay nhiều hơn người gửi tiền, Nhà nước cũng đang vay lớn và tạo ra hiệu ứng lấn át, và ngân hàng phải cạnh tranh để giữ người gửi trước các kênh khác như USD, chứng khoán, vàng. Ai là người quyết định? Ngân hàng Nhà nước đặt luật chơi chung, các ngân hàng thương mại tự định giá, và người gửi, người vay “bỏ phiếu” bằng lựa chọn của mình.","Còn vì sao không thể đơn giản yêu cầu ngân hàng giảm lãi suất? Vì lãi suất là giá của tiền, mà giá thì không thể hạ chỉ bằng mong muốn. Nếu ép lãi suất huy động xuống quá thấp khi tiền đang khan hiếm, người dân sẽ chuyển tiền sang nơi khác, ngân hàng thiếu nguồn vốn và người cần vay có thể còn khó vay hơn.","Và có lẽ, mỗi khi nghe tin lãi suất tăng hoặc giảm, thay vì chỉ hỏi “Điều này tốt hay xấu?”, chúng ta có thể bắt đầu bằng một câu hỏi khác: Vì sao lãi suất phải thay đổi ở thời điểm này, và sự thay đổi đó sẽ ảnh hưởng đến những ai?"],"draft":false},{"id":"thoi-quen-viet","topic":"Chuyện thường ngày","series":"","date":"28 tháng 10, 2026","title":"Vì sao mình tạo blog này","excerpt":"Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được…","body":["Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được, một điều nhỏ nhặt xảy ra trong ngày cũng tạo cho mình một ý tưởng mới. Mình thường tự đặt câu hỏi, thử nhìn một vấn đề từ nhiều góc độ và tìm cách lý giải nó theo cách hiểu của riêng mình.","Nhưng mình nhận ra, có những suy nghĩ cứ quanh quẩn mãi trong đầu mà chẳng đi đến đâu. Có những điều tưởng rằng đã hiểu, nhưng khi muốn diễn đạt lại thì mình vẫn chưa biết bắt đầu từ đâu. Vì vậy, mình muốn thử viết chúng ra, thay vì chỉ giữ chúng trong những cuộc đối thoại với chính mình.","Mình muốn ghi lại những điều mình quan sát, những câu hỏi mình còn băn khoăn và cả những điều mình dần nhận ra sau mỗi trải nghiệm. Không phải suy nghĩ nào cũng cần một câu trả lời, cũng không phải vấn đề nào cũng cần được giải quyết ngay. Đôi khi, chỉ cần viết xuống và nhìn nhận nó rõ ràng hơn, mình đã có thể hiểu bản thân thêm một chút.","Vì thế, mình muốn biến việc viết thành một cách để học hỏi. Để những điều mình đọc không chỉ dừng lại ở việc từng biết, mà dần trở thành kiến thức của riêng mình.","Và mình muốn, qua từng bài viết nhỏ, mình có thể hiểu thế giới rõ hơn một chút, hiểu bản thân sâu hơn một chút, và lưu giữ lại hành trình của chính mình.","Ngọc Hân"]}]</script>

var canEdit=false,armed=null,app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'khac'}
function topics(){var r=[];posts.forEach(function(p){if(r.indexOf(p.topic)<0)r.push(p.topic)});return r}
function mins(p){return Math.max(1,Math.ceil(p.body.join(' ').split(/\s+/).length/200))}
var TMAP={'chuyen-tien-bac':0,'ngam-mot-chut':1,'chuyen-thuong-ngay':2};
function tcls(t){var k=slug(t);if(TMAP[k]===undefined){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%997;return 't'+(4+h%4)}return 't'+TMAP[k]}
function meta(p){return (p.draft?'<span class="dr">Nháp</span>':'')+esc(p.date)+' · <span class="tn '+tcls(p.topic)+'">'+esc(p.topic)+'</span> · Đọc trong '+mins(p)+' phút'}
function inl(s){s=esc(s);
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
 return s}
function fmt(body){return body.map(function(t){
 var m=t.match(/^(#{2,3})\s+([\s\S]*)$/);
 if(m)return m[1].length===2?'<h2 class="ph">'+inl(m[2])+'</h2>':'<h3 class="ph">'+inl(m[2])+'</h3>';
 if(/^[-•]\s/.test(t))return '<ul>'+t.split('\n').map(function(l){return '<li>'+inl(l.replace(/^[-•]\s+/,''))+'</li>'}).join('')+'</ul>';
 return '<p>'+inl(t).replace(/\n/g,'<br>')+'</p>'}).join('')}
function wrap(m){var t=document.getElementById('f-body'),a=t.selectionStart,b=t.selectionEnd,x=t.value,sel=x.slice(a,b),r,s1=null,e1=null;
 function pre(){var h=x.slice(0,a);return a===0||/\n\n$/.test(h)?'':(/\n$/.test(h)?'\n':'\n\n')}
 function post(){var h=x.slice(b);return h===''||/^\n\n/.test(h)?'':(/^\n/.test(h)?'\n':'\n\n')}
 if(m==='b')r='**'+(sel||'chữ đậm')+'**';
 else if(m==='i')r='*'+(sel||'chữ nghiêng')+'*';
 else if(m==='h')r=pre()+'## '+(sel||'Tiêu đề')+post();
 else if(m==='l')r=pre()+(sel||'mục 1\nmục 2').split('\n').map(function(l){return '- '+l.replace(/^[-•]\s+/,'')}).join('\n')+post();
 else if(m==='a'){r='['+(sel||'văn bản liên kết')+'](https://)';s1=a+r.length-9;e1=a+r.length-1}
 t.value=x.slice(0,a)+r+x.slice(b);t.focus();t.setSelectionRange(s1===null?a:s1,e1===null?a+r.length:e1)}
function initTb(){var bs=document.querySelectorAll('.tbtn');if(!bs.length)return;
 bs.forEach(function(b){b.onclick=function(){wrap(b.getAttribute('data-m'))}});
 document.getElementById('f-body').addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&!e.shiftKey){var k=e.key.toLowerCase();if(k==='b'||k==='i'){e.preventDefault();wrap(k)}}})}
function seriesList(t){var r=[];posts.forEach(function(p){if(p.series&&r.indexOf(p.series)<0&&(!t||slug(p.topic)===t))r.push(p.series)});return r}
function inSeries(s){return posts.filter(function(p){return p.series===s}).reverse()}
function tagsFor(f){var s=seriesList(f);return s.length?'<div class="chips">'+s.map(function(x){return '<a class="chip tag" href="#series-'+slug(x)+'">#'+esc(x)+'</a>'}).join('')+'</div>':''}
function badge(p){if(!p.series)return '';var l=inSeries(p.series);return '<div style="margin:12px 0 4px"><a class="chip tag" style="font:500 13px Inter,system-ui,sans-serif;padding:5px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--accent)" href="#series-'+slug(p.series)+'">#'+esc(p.series)+' · Phần '+(l.indexOf(p)+1)+'/'+l.length+'</a></div>'}
function seriesNav(p){if(!p.series)return '';var l=inSeries(p.series),i=l.indexOf(p),a=l[i-1],b=l[i+1];return '<div class="sn"><span>'+(a?'<a href="#'+a.id+'">← Phần '+i+': '+esc(a.title)+'</a>':'')+'</span><span style="text-align:right">'+(b?'<a href="#'+b.id+'">Phần '+(i+2)+': '+esc(b.title)+' →</a>':'')+'</span></div>'}
function seriesPage(sl){var name=seriesList().filter(function(x){return slug(x)===sl})[0];if(!name)return home();var l=inSeries(name);return '<div class="chips"><a class="chip" href="#">← Tất cả</a></div><article style="padding-bottom:0"><div class="meta">Series · '+l.length+' bài</div><h1>#'+esc(name)+'</h1></article>'+l.map(function(p,i){return '<a class="post" href="#'+p.id+'"><div class="meta">Phần '+(i+1)+' · '+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('')}
function today(){var d=new Date();return d.getDate()+' tháng '+(d.getMonth()+1)+', '+d.getFullYear()}
var curF='';
function nz(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function cards(f,q){var k=nz(q||'').trim();var l=posts.filter(function(p){if(f&&slug(p.topic)!==f)return false;return !k||nz([p.title,p.topic,p.series,p.excerpt,p.body.join(' ')].join(' ')).indexOf(k)>=0});
 if(!l.length)return '<div class="empty">Không có bài nào khớp với “'+esc(q||'')+'”.</div>';
 return l.map(function(p){return '<a class="post '+tcls(p.topic)+(p.draft?' draft':'')+'" href="#'+p.id+'"><div class="meta">'+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('')}
function home(f){
 var chips='<div class="chips"><a class="chip'+(f?'':' on')+'" href="#">Tất cả</a>'+topics().map(function(t){return '<a class="chip tc '+tcls(t)+(slug(t)===f?' on':'')+'" href="#chu-de-'+slug(t)+'"><i class="dot"></i>'+esc(t)+'</a>'}).join('')+'</div>';
 var add=canEdit?'<div class="bar"><a class="btn" href="#viet-bai">+ Viết bài mới</a><button class="btn alt" id="dl">Tải về file HTML</button><span id="msg"></span></div>':'';
 curF=f||'';var sb='<input id="q" type="search" placeholder="Tìm bài viết…" aria-label="Tìm bài viết" autocomplete="off">';return add+sb+chips+tagsFor(f)+'<div id="plist">'+cards(curF,'')+'</div>';
}
function about(){return '<article><h1>Xin chào, mình là…</h1><p>Đây là góc nhỏ để mình viết về cuộc sống thường ngày: những buổi sáng, những món ăn, những suy nghĩ vụn vặt.</p><p>Bạn hãy thay phần giới thiệu này bằng đôi dòng về chính bạn nhé.</p><a class="back" href="#">← Về trang chủ</a></article>'}
function editor(p){
 p=p||{title:'',topic:'',date:today(),excerpt:'',body:[]};
 return '<article><a class="back" href="#">← Hủy</a><h1>'+(p.id?'Sửa bài viết':'Viết bài mới')+'</h1>'
 +'<label>Tiêu đề</label><input id="f-title" value="'+esc(p.title)+'">'
 +'<label>Chủ đề (chọn chủ đề có sẵn hoặc gõ chủ đề mới)</label><input id="f-topic" list="tl" value="'+esc(p.topic)+'"><datalist id="tl">'+topics().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Series (tùy chọn, ví dụ Lãi suất; để trống nếu là bài lẻ)</label><input id="f-series" list="sl" value="'+esc(p.series||'')+'"><datalist id="sl">'+seriesList().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Ngày</label><input id="f-date" value="'+esc(p.date)+'">'
 +'<label>Mô tả ngắn (để trống thì tự lấy từ đoạn đầu)</label><input id="f-excerpt" value="'+esc(p.excerpt)+'">'
 +'<label>Nội dung (cách một dòng trống để sang đoạn mới)</label><div class="tb"><button class="tbtn" data-m="b"><b>B</b></button><button class="tbtn" data-m="i"><i>I</i></button><button class="tbtn" data-m="h">Tiêu đề</button><button class="tbtn" data-m="l">Danh sách</button><button class="tbtn" data-m="a">Liên kết</button></div><textarea id="f-body" rows="12">'+esc(p.body.join('\n\n'))+'</textarea>'
 +'<div class="hint">Chọn đoạn chữ rồi bấm nút. Cũng dùng được Ctrl+B (đậm) và Ctrl+I (nghiêng).</div><label style="display:flex;align-items:center;gap:8px;margin:20px 0 0;font:500 14px Inter,system-ui,sans-serif;color:var(--text);cursor:pointer"><input type="checkbox" id="f-draft" style="width:auto;padding:0;margin:0"'+(p.draft?' checked':'')+'> Đây là bản nháp (chỉ mình tôi thấy)</label><div class="bar"><button class="btn" id="save">Lưu và đăng</button><span id="msg"></span></div></article>';
}
function v(id){return document.getElementById(id).value}
function say(t){var m=document.getElementById('msg');if(m)m.textContent=t}
function save(id){
 var t=v('f-title').trim(),tp=v('f-topic').trim()||'Chuyện thường ngày';
 var body=v('f-body').split(/\n\s*\n/).map(function(s){return s.trim()}).filter(Boolean);
 if(!t){say('Hãy nhập tiêu đề.');return}
 if(!body.length){say('Hãy nhập nội dung.');return}
 var ex=v('f-excerpt').trim()||body[0].slice(0,90)+(body[0].length>90?'…':'');
 var o={id:id||slug(t)+'-'+Date.now().toString(36),topic:tp,series:v('f-series').trim().replace(/^#/,''),date:v('f-date').trim()||today(),title:t,excerpt:ex,body:body,draft:!!document.getElementById('f-draft').checked};
 if(id)posts=posts.map(function(x){return x.id===id?o:x});else posts.unshift(o);
 commit('#'+o.id);
}
function commit(hash){
 say('Đang lưu…');
 claude.use('artifact').then(function(a){
  if(!a){say('Không lưu được ở đây.');return}
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');
  c.removeAttribute('data-theme');c.removeAttribute('style');location.hash=hash;
  return a.publish('<!DOCTYPE html>\n'+c.outerHTML);
 }).catch(function(e){say('Lưu không được: '+((e&&e.message)||'lỗi'))});
}
function buildDoc(){var c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');c.removeAttribute('data-theme');c.removeAttribute('style');return '<!DOCTYPE html>\n'+c.outerHTML}
function download(){claude.use('downloads').then(function(d){if(!d){say('Không tải được ở đây.');return}return d.save({filename:'index.html',data:buildDoc()})}).catch(function(e){if(!e||e.code!=='declined')say('Tải không được.')})}
function render(){
 var h=location.hash.replace('#',''),html='',on='n-home',p,bind=null;
 if(h.indexOf('chu-de-')===0){html=home(h.slice(7))}
 else if(h.indexOf('series-')===0){html=seriesPage(h.slice(7))}
 else if(h==='viet-bai'&&canEdit){html=editor();bind=function(){document.getElementById('save').onclick=function(){save(null)}}}
 else if(h.indexOf('sua-')===0&&canEdit&&(p=posts.filter(function(x){return x.id===h.slice(4)})[0])){html=editor(p);bind=function(){document.getElementById('save').onclick=function(){save(p.id)}}}
 else if((p=posts.filter(function(x){return x.id===h})[0])){
  var tools=canEdit?'<div class="bar"><a class="btn alt" href="#sua-'+p.id+'">Sửa bài</a><button class="btn alt" id="del">Xóa bài</button><span id="msg"></span></div>':'';
  html='<article id="post"><a class="back" href="#">← Tất cả bài viết</a><div class="meta" style="margin-top:22px">'+meta(p)+'</div>'+badge(p)+'<h1>'+esc(p.title)+'</h1>'+fmt(p.body)+seriesNav(p)+tools+'</article>';
  bind=function(){var d=document.getElementById('del');if(!d)return;d.onclick=function(){if(armed!==p.id){armed=p.id;d.textContent='Bấm lần nữa để xóa';return}posts=posts.filter(function(x){return x.id!==p.id});commit('#')}};
 } else html=home();
 app.innerHTML=html;
 document.getElementById('n-home').className=on==='n-home'?'on':'';
 
 if(bind)bind();
 initTb();
 var dl=document.getElementById('dl');if(dl)dl.onclick=download;
 var qi=document.getElementById('q');if(qi)qi.oninput=function(){document.getElementById('plist').innerHTML=cards(curF,qi.value)};
 var fd=document.getElementById('f-draft'),sv=document.getElementById('save');if(fd&&sv){var upd=function(){sv.textContent=fd.checked?'Lưu nháp':'Lưu và đăng'};fd.onchange=upd;upd()}
 window.scrollTo(0,0);onScroll();
}
function onScroll(){var y=window.pageYOffset||document.documentElement.scrollTop,max=document.documentElement.scrollHeight-window.innerHeight,pg=document.getElementById('pg'),tp=document.getElementById('top'),post=!!document.getElementById('post');
 if(pg){pg.style.display=post?'block':'none';pg.style.width=(post&&max>0?Math.min(100,y/max*100):0)+'%'}
 if(tp)tp.className=y>600?'show':''}
window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onScroll);
document.getElementById('top').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('theme').onclick=function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';r.setAttribute('data-theme',n);r.style.colorScheme=n;try{localStorage.setItem('theme',n)}catch(e){}};
window.addEventListener('hashchange',render);
render();
if(window.claude&&claude.use)claude.use('user').then(function(u){if(u&&u.canEdit()){canEdit=true;posts=all;render()}}).catch(function(){});
</script>
