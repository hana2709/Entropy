<script id="data" type="application/json">[{"id":"khi-cuoc-song-qua-ap-luc-con-nguoi-co-can-mot-dam-me-de-theo-duoi-mw3o3qhx","topic":"Chung","series":"","date":"5 tháng 11, 2026","title":"Khi cuộc sống quá áp lực, con người có cần một đam mê để theo đuổi","excerpt":"Có bao giờ bạn cảm thấy mình đã rất cố gắng, nhưng vẫn không thể thực sự nghỉ ngơi?","body":["Có bao giờ bạn cảm thấy mình đã rất cố gắng, nhưng vẫn không thể thực sự nghỉ ngơi?","Công việc cần hoàn thành, những kỹ năng cần học thêm, tiền bạc cần tích lũy và một tương lai mà chúng ta luôn muốn chuẩn bị thật tốt. Ngay cả khi đã kết thúc một ngày làm việc, đầu óc vẫn tiếp tục nghĩ về những việc chưa làm xong, những mục tiêu chưa đạt được và những điều mình có thể đang bỏ lỡ.","Mình nghĩ áp lực của người trưởng thành đôi khi không đến từ một vấn đề quá lớn, mà từ việc có quá nhiều điều cần phải lo cùng một lúc. Chúng ta muốn làm tốt công việc, phát triển bản thân, có tài chính ổn định và xây dựng một cuộc sống như mong muốn. Mỗi điều đều hợp lý, nhưng khi tất cả cùng xuất hiện, chúng ta dễ quên mất rằng bản thân cũng cần được nghỉ ngơi.","**Khi cuộc sống chỉ còn những điều phải làm**","Mình từng có những khoảng thời gian gần như lấp đầy tất cả thời gian rảnh bằng các hoạt động khác nhau. Sau giờ làm là học cao học, học tiếng Anh, tìm hiểu Python và các công cụ AI. Nếu còn thời gian, mình có thể đi tập yoga, đạp xe hoặc tìm thêm một việc gì đó để làm.","Mình thực sự muốn học hỏi và phát triển bản thân. Nhưng đôi khi, nhìn vào những việc cần hoàn thành, mình nhận ra rằng ngay cả thời gian nghỉ ngơi cũng có thể trở thành một nhiệm vụ khác trong danh sách của mình.","Có lẽ chúng ta đã quen với việc luôn phải tiến về phía trước. Khi hoàn thành một mục tiêu, chúng ta lại nghĩ đến mục tiêu tiếp theo. Khi học được một kỹ năng, chúng ta bắt đầu lo lắng về những kỹ năng mình chưa có. Và khi có một buổi tối không làm được điều gì hữu ích, chúng ta thậm chí còn cảm thấy có lỗi.","Nhưng nếu cuộc sống chỉ xoay quanh những việc phải làm, đến bao giờ chúng ta mới có thể cảm thấy mình đã làm đủ?","Mình không nghĩ chúng ta cần từ bỏ tham vọng hay ngừng cố gắng. Chỉ là bên cạnh những điều giúp mình tiến lên, có lẽ chúng ta cũng cần một điều gì đó giúp mình phục hồi sau những ngày mệt mỏi.","**Chúng ta cần một điều gì đó để mong chờ**","Mình nghĩ đam mê không nhất thiết phải là một điều lớn lao. Nó không cần trở thành sự nghiệp, không nhất thiết phải mang lại thu nhập và cũng chẳng cần được người khác công nhận.","Đó có thể là một môn thể thao, một nhạc cụ, việc đọc sách, chăm sóc cây cối hay đơn giản là dành thời gian tìm hiểu một chủ đề mình tò mò.","Điều quan trọng là khi làm những việc ấy, chúng ta cảm thấy mình đang thực sự tận hưởng khoảng thời gian của bản thân, thay vì tiếp tục chạy theo một tiêu chuẩn nào đó.","Với mình, có những lúc đạp xe vì trời mát, uống một ly coldbrew vì thích hương vị cà phê, hay ngồi ở một quán quen vào cuối tuần đã đủ khiến một ngày trở nên dễ chịu hơn. Gần đây, mình cũng tìm thấy niềm vui trong việc viết và khám phá những chủ đề mình quan tâm. Có những ngày, điều mình mong chờ nhất đơn giản là được trở về, mở blog lên và hoàn thành một bài viết còn dang dở.","Những việc ấy không giải quyết được các vấn đề trong cuộc sống. Chúng không khiến công việc ít đi, không giúp mình hoàn thành mọi mục tiêu và cũng chẳng làm tương lai tự nhiên trở nên chắc chắn hơn. Nhưng chúng cho mình một điều để mong chờ, một khoảng thời gian mà mình được tự do suy nghĩ, tò mò và tận hưởng mà không cần phải chứng minh điều gì.","Có lẽ đó cũng là giá trị của một đam mê: không nhất thiết khiến cuộc sống của chúng ta tốt lên ngay lập tức, nhưng giúp những ngày bình thường trở nên đáng sống hơn.","**Đam mê không phải một mục tiêu khác cần hoàn thành**","Tuy nhiên, mình nghĩ có một điều chúng ta cần cẩn thận: đừng biến cả đam mê thành một áp lực mới.","Một sở thích có thể bắt đầu vì niềm vui, nhưng rồi chúng ta muốn phải giỏi hơn. Một môn thể thao ban đầu giúp thư giãn, nhưng sau đó lại trở thành một chỉ tiêu về sức khỏe. Một kỹ năng được học vì tò mò có thể nhanh chóng biến thành nỗi lo rằng mình chưa đủ tiến bộ.","Đến cuối cùng, ngay cả những thứ từng giúp chúng ta nghỉ ngơi cũng trở thành một phần trong danh sách những việc cần làm.","Mình đang học cách không lấp đầy tất cả những buổi tối và cuối tuần của mình. Có những ngày mình chỉ muốn ở nhà, không cần một kế hoạch đặc biệt nào. Có những lúc mình muốn nghỉ ngơi thay vì cố gắng học thêm một thứ mới. Và mình cũng muốn có thể làm một việc chỉ vì thích nó, mà không cần tự hỏi nó có ích gì cho tương lai hay không.","Mình nghĩ đam mê nên là một nơi để trở về, chứ không phải một tiêu chuẩn khác để đánh giá bản thân.","Chúng ta không cần phải viết thật hay, chơi một nhạc cụ thật giỏi hay đạt được thành tích đáng kể trong một môn thể thao mới có quyền tận hưởng những hoạt động ấy. Đôi khi, chỉ cần làm và cảm thấy vui đã là đủ.","**Sau cùng, chúng ta cũng cần được phục hồi**","Mình vẫn có những mục tiêu cần hoàn thành, những khoản tiền cần tiết kiệm và những kỹ năng muốn học hỏi. Cuộc sống vẫn còn rất nhiều điều phải lo, và một sở thích không thể khiến tất cả những áp lực ấy biến mất.","Nhưng mình bắt đầu hiểu rằng chúng ta không thể chỉ liên tục sử dụng năng lượng mà không tìm cách phục hồi nó. Đôi khi, điều cần thiết không phải là tìm thêm một mục tiêu để theo đuổi, mà là tìm một việc khiến mình muốn quay trở lại với cuộc sống sau những ngày mệt mỏi.","Đam mê có thể là một nơi như thế. Không phải nơi để trốn tránh thực tại, mà là nơi giúp chúng ta tạm rời khỏi những yêu cầu của cuộc sống, tận hưởng một điều mình yêu thích và lấy lại năng lượng để tiếp tục.","Và nếu hôm nay bạn vẫn chưa tìm thấy một đam mê như thế, có lẽ cũng không cần quá vội vàng. Nó không nhất thiết phải xuất hiện như một điều gì đó lớn lao. Đôi khi, nó chỉ bắt đầu từ một việc nhỏ mà bạn muốn làm thêm một lần nữa, rồi dần dần trở thành điều khiến bạn mong chờ mỗi ngày.","Sau cùng, mình nghĩ một cuộc sống tốt đẹp không chỉ là cuộc sống có đủ những điều để theo đuổi, mà còn là cuộc sống có đủ những điều giúp chúng ta hồi phục sau mỗi lần mệt mỏi.","Chúng ta không chỉ sống để làm việc, học hỏi, kiếm tiền và hoàn thành những mục tiêu đã đặt ra. Chúng ta còn cần những niềm vui nhỏ bé, những khoảng thời gian thuộc về riêng mình và một lý do để cảm thấy ngày hôm nay đáng sống, ngay cả khi chẳng có thành tựu nào đặc biệt."],"draft":false},{"id":"khung-hoang-tien-te-thai-lan-1997-mw3nf8pn","topic":"Tài chính","series":"Lãi suất","date":"5 tháng 11, 2026","title":"Khủng hoảng tiền tệ Thái Lan 1997","excerpt":"Có một nghịch lý trong kinh tế: dòng vốn quốc tế có thể giúp một quốc gia tăng trưởng nhan…","body":["Có một nghịch lý trong kinh tế: dòng vốn quốc tế có thể giúp một quốc gia tăng trưởng nhanh chóng, nhưng cũng có thể trở thành nguồn cơn của một cuộc khủng hoảng khi dòng vốn ấy đột ngột đảo chiều.","Thái Lan những năm đầu thập niên 1990 là một ví dụ điển hình. Từng được xem là một trong những nền kinh tế tăng trưởng năng động nhất châu Á, quốc gia này đã phải đối mặt với cuộc khủng hoảng tiền tệ nghiêm trọng vào năm 1997. Trong câu chuyện ấy, bên cạnh những yếu tố nội tại của nền kinh tế, cái tên George Soros và các cuộc tấn công đầu cơ vào đồng Baht đã trở thành một phần đáng chú ý.","Vậy điều gì đã xảy ra?","## 1. Khi Thái Lan mở cửa thị trường tài chính","Đầu những năm 1990, Thái Lan từng bước tự do hóa hệ thống tài chính, trong đó có tự do hóa lãi suất. Thay vì để Nhà nước kiểm soát chặt chẽ mức lãi suất, các ngân hàng được trao nhiều quyền chủ động hơn trong việc xác định lãi suất huy động và cho vay.","Mục tiêu của chính sách này là thúc đẩy cạnh tranh, nâng cao hiệu quả phân bổ vốn và đưa thị trường tài chính trong nước hội nhập sâu hơn với quốc tế.","Cùng với quá trình đó, Thái Lan cũng mở rộng khả năng tiếp cận nguồn vốn nước ngoài thông qua việc thành lập Bangkok International Banking Facilities (BIBF) vào năm 1992, bắt đầu hoạt động từ năm 1993.","Dòng vốn quốc tế vì thế có thêm điều kiện chảy vào nền kinh tế. Các ngân hàng và doanh nghiệp Thái Lan có thể tiếp cận nguồn vốn nước ngoài với chi phí hấp dẫn, trong khi nhà đầu tư quốc tế nhìn thấy cơ hội sinh lời tại một nền kinh tế đang tăng trưởng nhanh.","Thoạt nhìn, đây là một tín hiệu tích cực. Nhưng vấn đề nằm ở chỗ: dòng vốn đi vào nhanh đến đâu thì nền kinh tế có đủ khả năng hấp thụ và quản lý rủi ro đến đó hay không?","## 2. Dòng vốn giá rẻ và cơn sốt bất động sản","Trong giai đoạn này, Thái Lan duy trì tỷ giá đồng Baht tương đối ổn định so với USD. Điều đó khiến các nhà đầu tư nước ngoài có cảm giác rủi ro tỷ giá không quá lớn khi cho vay hoặc đầu tư vào Thái Lan.","Kết hợp với triển vọng tăng trưởng và mức sinh lời hấp dẫn, dòng vốn nước ngoài đổ vào ngày càng nhiều. Một phần đáng kể là các khoản vay ngắn hạn bằng ngoại tệ.","Nguồn vốn dồi dào thúc đẩy hoạt động tín dụng, đầu tư và tiêu dùng. Đặc biệt, bất động sản trở thành một trong những lĩnh vực thu hút lượng vốn lớn. Giá đất và giá nhà tăng nhanh, các dự án mới liên tục được triển khai, tạo nên cảm giác rằng nền kinh tế đang phát triển rất mạnh mẽ.","Nhưng đằng sau sự sôi động ấy là những rủi ro ngày càng lớn.","Nhiều doanh nghiệp và tổ chức tài chính vay bằng USD nhưng đầu tư vào các tài sản tạo ra dòng tiền bằng Baht. Khi đồng Baht còn ổn định, rủi ro này chưa bộc lộ rõ. Tuy nhiên, nếu Baht mất giá, nghĩa vụ trả nợ bằng USD sẽ tăng lên đáng kể khi quy đổi sang nội tệ.","Nói cách khác, Thái Lan đang tăng trưởng dựa một phần vào nguồn vốn nước ngoài, nhưng lại chưa kiểm soát tốt rủi ro từ chính nguồn vốn đó.","## 3. George Soros và cuộc tấn công vào đồng Baht","Đến năm 1996, những dấu hiệu bất ổn bắt đầu xuất hiện. Xuất khẩu suy yếu, thị trường bất động sản chững lại, nhiều doanh nghiệp gặp khó khăn trong việc trả nợ. Niềm tin của nhà đầu tư quốc tế vào triển vọng kinh tế Thái Lan dần suy giảm.","Trong khi đó, đồng Baht vẫn được duy trì ở mức tỷ giá tương đối ổn định. Điều này tạo ra một tình thế khó khăn: nền kinh tế đã yếu đi, nhưng tỷ giá vẫn phải được bảo vệ.","Các nhà đầu cơ bắt đầu đặt cược rằng đồng Baht sẽ không thể duy trì mức tỷ giá hiện tại. Họ vay Baht, bán ra để mua USD, với kỳ vọng rằng khi Baht mất giá, họ có thể mua lại Baht với chi phí thấp hơn để hoàn trả khoản vay và thu lợi nhuận.","Đây chính là hình thức **tấn công tiền tệ (currency attack)**.","Trong câu chuyện này, George Soros – nhà đầu tư nổi tiếng và người đứng sau quỹ Quantum Fund – trở thành cái tên được nhắc đến nhiều nhất. Các nhà chức trách Thái Lan từng đề cập đến sự tham gia của những quỹ đầu cơ lớn, trong đó có các quỹ gắn với Soros, trong làn sóng đầu cơ chống lại đồng Baht.","Tuy nhiên, cần nhìn nhận rằng Soros không phải người duy nhất tham gia, và cũng không thể xem ông là nguyên nhân tạo ra cuộc khủng hoảng. Các ngân hàng, tổ chức tài chính và nhiều nhà đầu tư quốc tế khác cũng tham gia giao dịch đầu cơ. Những điểm yếu của nền kinh tế Thái Lan đã tồn tại từ trước đó.","Điều đáng nói là khi nhiều nhà đầu tư cùng tin rằng một đồng tiền sẽ mất giá, họ có xu hướng bán đồng tiền đó để chuyển sang ngoại tệ mạnh. Hành động này càng làm gia tăng áp lực mất giá, khiến niềm tin thị trường suy giảm nhanh hơn.","Để bảo vệ đồng Baht, Ngân hàng Trung ương Thái Lan phải liên tục bán USD từ dự trữ ngoại hối và mua lại Baht. Nhưng dự trữ ngoại hối không phải nguồn lực vô hạn. Càng phải can thiệp nhiều, khả năng bảo vệ tỷ giá càng suy yếu.","Các cuộc tấn công đầu cơ vì thế giống như **giọt nước làm tràn ly**: chúng đẩy những mất cân đối đã tích tụ trong nhiều năm đến thời điểm bùng phát.","Ngày 2/7/1997, Thái Lan buộc phải từ bỏ cơ chế neo tỷ giá và chuyển sang thả nổi đồng Baht. Đồng tiền này nhanh chóng mất giá mạnh.","Và những rủi ro từng bị che khuất bắt đầu bộc lộ. Các doanh nghiệp vay USD nhưng có nguồn thu bằng Baht phải đối mặt với nghĩa vụ trả nợ tăng vọt. Hệ thống tài chính chịu áp lực lớn, thị trường bất động sản suy sụp và khủng hoảng lan rộng ra nhiều quốc gia châu Á.","## 4. Bài học từ câu chuyện Thái Lan","Nhìn lại cuộc khủng hoảng năm 1997, có thể rút ra một số bài học đáng chú ý.","**Thứ nhất, tự do hóa tài chính cần đi cùng với năng lực quản lý rủi ro.**","Việc mở cửa thị trường và tự do hóa lãi suất có thể giúp dòng vốn được phân bổ hiệu quả hơn. Nhưng nếu hệ thống ngân hàng, doanh nghiệp và cơ quan quản lý chưa đủ năng lực kiểm soát rủi ro, dòng vốn lớn có thể nhanh chóng tạo ra bong bóng tài sản và những khoản nợ thiếu bền vững.","**Thứ hai, dòng vốn nước ngoài không phải lúc nào cũng là nguồn lực ổn định.**","Vốn có thể chảy vào rất nhanh khi nhà đầu tư nhìn thấy cơ hội, nhưng cũng có thể rút đi đột ngột khi niềm tin thay đổi. Đặc biệt, việc phụ thuộc quá nhiều vào vốn vay ngắn hạn bằng ngoại tệ khiến nền kinh tế dễ bị tổn thương khi tỷ giá biến động.","**Thứ ba, không thể xem sự ổn định của tỷ giá là điều hiển nhiên.**","Một đồng tiền được duy trì ổn định trong thời gian dài không có nghĩa là nền tảng kinh tế phía sau nó thực sự vững chắc. Khi tỷ giá không phản ánh đầy đủ những mất cân đối trong nền kinh tế, áp lực điều chỉnh có thể bị trì hoãn, nhưng không biến mất.","---","Câu chuyện Thái Lan cho thấy tự do hóa lãi suất và mở cửa tài chính có thể tạo ra cơ hội tăng trưởng lớn, nhưng cũng đi kèm những rủi ro không thể xem nhẹ.","Soros có thể là cái tên nổi bật trong câu chuyện tấn công đồng Baht, nhưng một nhà đầu cơ chỉ có thể khai thác những điểm yếu đã tồn tại. Nếu nền tảng kinh tế đủ vững chắc, một cuộc tấn công đầu cơ sẽ khó có thể đẩy cả hệ thống vào khủng hoảng.","**Tăng trưởng nhờ dòng vốn dễ dàng có thể tạo ra những con số rất đẹp trong ngắn hạn, nhưng chỉ có một nền tảng tài chính lành mạnh mới giúp nền kinh tế đứng vững trong dài hạn.**"],"draft":false},{"id":"neu-lai-suat-cu-tang-khong-kiem-soat-dieu-gi-xay-ra-mw3ep4xd","topic":"Tài chính","series":"Lãi suất","date":"5 tháng 11, 2026","title":"Tự do hóa lãi suất – Bài học từ khủng hoảng tiền tệ Thái Lan 1997","excerpt":"Có một nghịch lý trong kinh tế học: Một chính sách được đưa ra với mục tiêu giúp thị trườn…","body":["Có một nghịch lý trong kinh tế học: Một chính sách được đưa ra nhằm giúp thị trường vận hành hiệu quả hơn đôi khi lại có thể tạo ra những rủi ro mà chính nền kinh tế không đủ khả năng kiểm soát.","Đầu những năm 1990, Thái Lan tiến hành tự do hóa lãi suất và mở cửa thị trường tài chính. Dòng vốn nước ngoài nhanh chóng đổ vào nền kinh tế, hoạt động tín dụng mở rộng, thị trường bất động sản tăng trưởng mạnh mẽ. Thái Lan trở thành một trong những nền kinh tế phát triển nhanh nhất châu Á.","Nhưng chỉ vài năm sau, những gì từng được xem là động lực tăng trưởng lại trở thành một phần nguyên nhân dẫn đến cuộc khủng hoảng tài chính nghiêm trọng năm 1997.","Vậy điều gì đã xảy ra? Và tại sao tự do hóa lãi suất, một chính sách được kỳ vọng thúc đẩy phát triển kinh tế, lại có thể góp phần tạo ra một cuộc khủng hoảng?","**1. Tự do hóa lãi suất: Khi thị trường được trao quyền quyết định**","Trước hết, tự do hóa lãi suất là quá trình dỡ bỏ các quy định kiểm soát trực tiếp đối với lãi suất huy động và cho vay, để các tổ chức tín dụng có nhiều quyền chủ động hơn trong việc xác định lãi suất dựa trên cung – cầu vốn và mức độ rủi ro.","Thay vì để Nhà nước quy định ngân hàng được huy động hoặc cho vay ở mức lãi suất nào, thị trường sẽ đóng vai trò lớn hơn trong việc quyết định giá của vốn.","Và chắc chắn, tự do hóa lãi suất sẽ khiến lãi suất tăng. Ngân hàng cạnh tranh bằng lãi suất, và ngân hàng nào cũng muốn huy động được nhiều hơn.","Về lý thuyết, chính sách này mang lại nhiều lợi ích:","Khuyến khích tiết kiệm thông qua mức lãi suất huy động hấp dẫn hơn.","Tăng cạnh tranh giữa các ngân hàng.","Giúp nguồn vốn được phân bổ theo nhu cầu và mức độ rủi ro.","Thúc đẩy sự phát triển của thị trường tài chính.","Tuy nhiên, tự do hóa lãi suất cũng đặt ra một thách thức: Khi ngân hàng được tự do huy động và cho vay, liệu hệ thống tài chính đã đủ năng lực để kiểm soát những rủi ro phát sinh hay chưa?","Câu chuyện của Thái Lan đầu những năm 1990 là một ví dụ đáng suy ngẫm.","**2. Thái Lan đầu những năm 1990: Cánh cửa đón dòng vốn quốc tế**","Trong giai đoạn cuối những năm 1980 và đầu những năm 1990, Thái Lan thực hiện nhiều cải cách nhằm mở cửa hệ thống tài chính.","Quá trình tự do hóa lãi suất được triển khai từng bước và cơ bản hoàn tất vào tháng 6/1992. Cùng với đó, quốc gia này nới lỏng các quy định về ngoại hối và luân chuyển vốn quốc tế.","Một dấu mốc quan trọng là sự ra đời của Bangkok International Banking Facility (BIBF), được thành lập năm 1992 và đi vào hoạt động năm 1993. Cơ chế này tạo điều kiện cho các ngân hàng tại Thái Lan huy động vốn từ nước ngoài và cung cấp các khoản vay bằng ngoại tệ.","Trong bối cảnh đó, Thái Lan trở thành điểm đến hấp dẫn của dòng vốn quốc tế.","Hãy thử đặt mình vào vị trí một nhà đầu tư nước ngoài.","Nếu có thể huy động vốn bằng USD với lãi suất tương đối thấp, sau đó đưa vốn vào Thái Lan để đầu tư hoặc cho vay với mức lợi tức cao hơn, nhà đầu tư có thể thu được khoản chênh lệch đáng kể.","Đặc biệt, Thái Lan khi đó duy trì tỷ giá đồng Baht tương đối ổn định quanh mức 25 Baht/USD trong nhiều năm. Điều này khiến nhiều nhà đầu tư đánh giá rủi ro tỷ giá là không quá lớn.","Kết quả là dòng vốn nước ngoài đổ vào Thái Lan ngày càng mạnh mẽ.","Nhưng có một vấn đề: Dòng vốn này sẽ được sử dụng vào đâu?","**3. Khi dòng vốn chảy vào bất động sản: Tăng trưởng nóng và bong bóng tài sản**","Khi nguồn vốn trở nên dồi dào, hoạt động cho vay của các ngân hàng và tổ chức tài chính cũng mở rộng nhanh chóng.","Thay vì tập trung hoàn toàn vào sản xuất và nâng cao năng suất, một lượng vốn đáng kể lại chảy vào bất động sản và các hoạt động đầu cơ tài sản.","Cơ chế này tạo ra một vòng xoáy khá dễ hình dung:","Giá bất động sản tăng → Giá trị tài sản bảo đảm tăng → Doanh nghiệp có thể vay thêm vốn → Tiền tiếp tục đổ vào bất động sản → Giá bất động sản tiếp tục tăng.","Khi giá nhà đất liên tục đi lên, cả người vay lẫn ngân hàng đều có xu hướng tin rằng giá trị tài sản sẽ tiếp tục tăng trong tương lai.","Nhưng giá tài sản tăng không đồng nghĩa với việc giá trị kinh tế thực sự được tạo ra.","Một dự án bất động sản có giá trị định giá cao không có nghĩa là nó sẽ tạo ra đủ dòng tiền để trả nợ. Một tòa nhà được xây dựng không có nghĩa là sẽ có người thuê hoặc người mua.","Đến khi thị trường xuất hiện tình trạng dư cung, nhu cầu suy yếu và giá bất động sản không còn tăng như kỳ vọng, những khoản đầu tư trước đó bắt đầu bộc lộ rủi ro.","Nhiều doanh nghiệp không thể trả nợ, trong khi các tổ chức tài chính phải đối mặt với nguy cơ nợ xấu gia tăng.","Đáng chú ý hơn, một phần vốn nước ngoài được huy động dưới dạng các khoản vay ngắn hạn bằng USD, nhưng lại được sử dụng để tài trợ cho những dự án dài hạn trong nước.","Điều này khiến hệ thống tài chính trở nên đặc biệt dễ tổn thương nếu dòng vốn quốc tế đột ngột đảo chiều.","**4. Khi dòng vốn đảo chiều: Khủng hoảng năm 1997**","Đến năm 1996, nền kinh tế Thái Lan bắt đầu xuất hiện nhiều dấu hiệu bất ổn.","Tăng trưởng xuất khẩu chậm lại, thị trường bất động sản suy yếu và thâm hụt tài khoản vãng lai ở mức cao, khoảng 8% GDP.","Nhà đầu tư bắt đầu nghi ngờ khả năng duy trì tỷ giá cố định của đồng Baht.","Khi niềm tin suy giảm, dòng vốn nước ngoài bắt đầu rút khỏi Thái Lan. Nhu cầu chuyển đổi Baht sang USD tăng mạnh, tạo áp lực lớn lên tỷ giá.","Ngân hàng Trung ương Thái Lan phải sử dụng dự trữ ngoại hối để bảo vệ đồng Baht, đồng thời tăng lãi suất nhằm hạn chế áp lực mất giá.","Nhưng việc tăng lãi suất lại khiến chi phí vay vốn của doanh nghiệp và tổ chức tài chính tăng lên, trong khi họ vốn đã gặp khó khăn vì thị trường bất động sản suy yếu.","Một vấn đề khác càng khiến tình hình nghiêm trọng hơn: Nhiều doanh nghiệp vay USD nhưng tạo ra doanh thu chủ yếu bằng Baht.","Ví dụ, một doanh nghiệp vay 1 triệu USD khi tỷ giá là 25 Baht/USD. Khoản nợ tương đương 25 triệu Baht.","Nếu tỷ giá tăng lên 40 Baht/USD sau khi đồng Baht mất giá, khoản nợ quy đổi đã tăng lên 40 triệu Baht, dù doanh nghiệp không vay thêm bất kỳ khoản tiền nào.","Đây là rủi ro chênh lệch tiền tệ (Currency Mismatch).","Ngày 2/7/1997, Thái Lan buộc phải từ bỏ cơ chế tỷ giá cố định và chuyển sang thả nổi có quản lý đồng Baht.","Đồng nội tệ mất giá mạnh, những doanh nghiệp vay nợ bằng USD chịu tổn thất lớn, nợ xấu gia tăng và hệ thống tài chính rơi vào khủng hoảng.","Cuộc khủng hoảng tiền tệ Thái Lan sau đó lan rộng ra nhiều nền kinh tế châu Á.","5. Bài học từ Thái Lan: Tự do hóa không đồng nghĩa với tăng trưởng bền vững","Nhìn lại câu chuyện Thái Lan, mình nghĩ có ba bài học đáng chú ý.","Thứ nhất, tự do hóa tài chính cần đi cùng với năng lực quản trị rủi ro.","Khi ngân hàng được tự do huy động và cho vay, việc kiểm soát chất lượng tín dụng càng trở nên quan trọng. Nếu các ngân hàng chỉ tập trung mở rộng quy mô mà không đánh giá đúng khả năng trả nợ của khách hàng, rủi ro sẽ tích tụ trong hệ thống.","Thứ hai, dòng vốn nước ngoài không phải lúc nào cũng mang lại tăng trưởng bền vững.","Nguồn vốn quốc tế có thể thúc đẩy đầu tư và phát triển kinh tế. Nhưng nếu vốn ngắn hạn được sử dụng để tài trợ cho các dự án dài hạn, hoặc tập trung quá nhiều vào hoạt động đầu cơ tài sản, nền kinh tế sẽ rất dễ tổn thương khi dòng vốn đảo chiều.","Thứ ba, tăng trưởng tín dụng cao không đồng nghĩa với việc nền kinh tế đang khỏe mạnh.","Điều quan trọng không chỉ là lượng vốn được đưa vào nền kinh tế, mà còn là vốn được sử dụng vào đâu, có tạo ra giá trị thực hay không và liệu người đi vay có đủ khả năng hoàn trả hay không.","Kết luận","Câu chuyện Thái Lan năm 1997 cho thấy tự do hóa lãi suất và mở cửa tài chính có thể mang lại những cơ hội tăng trưởng rất lớn, nhưng cũng đi kèm với những rủi ro nếu nền kinh tế chưa có đủ năng lực kiểm soát.","Vấn đề không nằm ở việc tự do hóa lãi suất là đúng hay sai, mà nằm ở cách thức và điều kiện triển khai chính sách này.","Một thị trường tài chính phát triển không chỉ cần nguồn vốn dồi dào, mà còn cần khả năng phân bổ vốn hiệu quả và quản trị rủi ro tốt.","Và có lẽ, bài học lớn nhất từ Thái Lan là: Tăng trưởng nhờ dòng vốn dễ dàng có thể tạo ra những con số rất đẹp trong ngắn hạn, nhưng chỉ có một nền tảng tài chính lành mạnh mới giúp nền kinh tế đứng vững trong dài hạn."],"draft":true},{"draft":true,"id":"ap-luc-nguon-goc-sau-xa-cua-dong-luc-mw3emj08","topic":"Chung","series":"","date":"5 tháng 11, 2026","title":"Áp lực: Nguồn gốc sâu xa của động lực","excerpt":"Chúng ta học được cách tự tạo động lực bằng việc nghĩ đến tương lai tươi sáng. Nhưng nếu c…","body":["Chúng ta học được cách tự tạo động lực bằng việc nghĩ đến tương lai tươi sáng. Nhưng nếu chúng ta không có áp lực bắt buộc phải tốt, thì liệu nó có thể trở thành động lực được không"]},{"id":"nhung-viec-quan-trong-nhung-khong-gap-cai-gia-cua-viec-luon-de-ngay-mai-mw2abv5c","topic":"Tâm lý học","series":"","date":"4 tháng 11, 2026","title":"Những việc quan trọng nhưng không gấp: Cái giá của việc luôn để ngày mai","excerpt":"Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần …","body":["Mình từng nghĩ rằng nếu một vấn đề chưa thực sự ảnh hưởng đến cuộc sống thì mình chưa cần dành quá nhiều sự quan tâm cho nó. Mình có thể tạm gác nó sang một bên, tiếp tục giải quyết những việc đang cần ưu tiên trước mắt và quay lại xử lý khi có nhiều thời gian hơn.","Cho đến khi mình nhận ra rằng không phải vấn đề nào cũng chờ mình sẵn sàng mới trở nên nghiêm trọng.","Trước đây, mình từng có những dấu hiệu mỏi cổ. Cảm giác ấy không quá nghiêm trọng đến mức khiến mình phải dừng công việc đang làm. Mình vẫn có thể đi làm, học tập và sinh hoạt bình thường, nên cũng không thực sự chú ý đến nó. Mình nghĩ có lẽ chỉ cần nghỉ ngơi một chút, rồi mọi chuyện sẽ ổn.","Nhưng tình trạng ấy không đơn giản biến mất. Dần dần, mình bắt đầu bị tê tay, cổ đau nhức nhiều hơn, có những lúc cảm giác khó chịu đến mức không thể ngủ ngon. Đến lúc ấy, mình mới thực sự lo lắng và phải đi khám, chụp MRI, tìm hiểu nguyên nhân cũng như cách tập luyện phù hợp để duy trì sức khỏe.","Nhìn lại, mình nhận ra rằng mình không hoàn toàn bỏ qua sức khỏe. Mình chỉ đợi đến khi cơ thể lên tiếng đủ lớn mới bắt đầu chú ý đến nó.","Nếu mình quan tâm đến những dấu hiệu ban đầu và chủ động tìm cách xử lý sớm hơn, có lẽ mình đã không phải trải qua một giai đoạn khó chịu đến vậy. Tất nhiên, không phải mọi vấn đề sức khỏe đều có thể ngăn ngừa bằng cách phát hiện sớm, nhưng trải nghiệm ấy khiến mình hiểu rằng việc chưa cảm thấy cấp bách không có nghĩa là mình không cần hành động.","Điều này không chỉ đúng với sức khỏe.","Ma trận Eisenhower phân chia công việc theo hai tiêu chí: mức độ quan trọng và tính cấp bách. Trong đó, nhóm công việc quan trọng nhưng chưa cấp bách thường là nhóm dễ bị bỏ quên nhất. Tại sao lại như vậy? Có lẽ vì những việc cấp bách luôn tạo ra áp lực ngay lập tức, trong khi hậu quả của việc bỏ bê những điều quan trọng thường chỉ xuất hiện sau một thời gian dài. Đó có thể là chăm sóc sức khỏe, học tập, xây dựng tài chính hay vun đắp các mối quan hệ. Chúng không đòi hỏi mình phải hành động ngay, nhưng lại âm thầm quyết định chất lượng cuộc sống về lâu dài.","Trong cuộc sống, có rất nhiều việc quan trọng nhưng chưa gấp. Mình biết mình cần học thêm một kỹ năng, xây dựng khoản tiết kiệm, quan tâm đến những mối quan hệ hay dành thời gian nghỉ ngơi. Nhưng vì những việc ấy chưa tạo ra hậu quả ngay lập tức, mình thường ưu tiên những việc đang chờ giải quyết trước mắt.","Mình nghĩ rằng mình vẫn còn thời gian.","Có thể ngày mai sẽ bắt đầu. Có thể đợi công việc bớt bận hơn. Có thể chờ đến khi điều kiện thuận lợi hơn.","Nhưng đôi khi, chính khoảng thời gian mình nghĩ rằng mình có thể trì hoãn lại là khoảng thời gian quý giá nhất để chủ động giải quyết vấn đề.","Những việc quan trọng nhưng không gấp sẽ không tự biến mất chỉ vì mình chưa chú ý đến chúng. Đôi khi, chúng chỉ đang chờ đến lúc trở nên đủ nghiêm trọng để buộc mình phải hành động."]},{"id":"tu-lai-suat-5-den-9-chuyen-gi-dang-xay-ra-voi-thi-truong-tien-te-viet-nam-mw1upwzw","topic":"Tài chính","series":"Lãi suất","date":"4 tháng 11, 2026","title":"Từ lãi suất 5% đến 9%: Chuyện gì đang xảy ra với thị trường tiền tệ Việt Nam?","excerpt":"Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–…","body":["Chúng ta đã chứng kiến giai đoạn lãi suất huy động chỉ ở mức khoảng 5% vào giai đoạn 2023–2024. Đến năm 2026, một số ngân hàng đã niêm yết mức 8–9%/năm ở những kỳ hạn từ 1 năm trở lên.","Vậy điều gì đã khiến lãi suất thay đổi đáng kể như vậy? Ai là người quyết định mức lãi suất ngân hàng? Và tại sao chúng ta không thể đơn giản yêu cầu các ngân hàng giảm lãi suất để việc vay tiền trở nên dễ dàng hơn? Bài viết này lần lượt đi qua ba câu hỏi đó.","**1. Nhìn lại thị trường năm 2023–2024**","Hãy nghĩ đến một quán ăn vắng khách. Chủ quán nghĩ đến việc giảm giá để kéo khách quay lại. Lãi suất giai đoạn 2023–2024 cũng có phần giống vậy. Nền kinh tế còn chịu ảnh hưởng từ những khó khăn sau đại dịch, hoạt động sản xuất, kinh doanh và thị trường bất động sản gặp nhiều thách thức, nên nhu cầu vay vốn ở một số lĩnh vực suy yếu. Khi ít người cần vay, ngân hàng sẵn sàng hạ “giá” của đồng tiền.","Sau những đợt điều chỉnh lãi suất điều hành của Ngân hàng Nhà nước trong năm 2023, các ngân hàng thương mại cũng từng bước hạ lãi suất huy động và cho vay, đưa mức huy động về quanh 5%/năm. Vay rẻ giúp doanh nghiệp dễ cân nhắc đầu tư hơn và giảm gánh nặng trả lãi cho người đang vay. Nhưng “giá rẻ” chỉ bền khi nguồn cung và nhu cầu về vốn còn cân bằng, và đó chính là điều đã thay đổi.","**2. Vì sao đến năm 2026, lãi suất lại chịu áp lực tăng?**","Cách dễ hình dung nhất là xem lãi suất như **giá của tiền**. Giống bất kỳ món hàng nào ở chợ, thứ gì nhiều người cần mà ít người có thì giá sẽ đắt lên. Năm 2026, tiền đang rơi vào đúng tình huống đó, vì ba lý do chính.","**Lý do 1: Nhu cầu vay vốn tăng nhanh, trong khi tiền gửi vào chậm hơn**","Trong 6 tháng đầu năm 2026, nhu cầu vốn của nền kinh tế tăng nhanh hơn khả năng huy động vốn của hệ thống ngân hàng. Theo số liệu được công bố tại họp báo của Ngân hàng Nhà nước (NHNN) ngày 2/7/2026, đến ngày 15/6, tín dụng tăng 6,38% so với đầu năm, trong khi huy động vốn chỉ tăng khoảng 4,3% — chênh lệch hơn 2 điểm phần trăm.","Điều này có nghĩa là dư nợ cho vay đang tăng nhanh hơn nguồn tiền gửi mà ngân hàng huy động được. Khi doanh nghiệp và người dân cần vốn nhiều hơn, trong khi tiền gửi không tăng tương ứng, các ngân hàng phải cạnh tranh để thu hút nguồn tiền nhàn rỗi bằng cách nâng lãi suất tiết kiệm. Thực tế, NHNN ghi nhận đến cuối tháng 6, tín dụng toàn hệ thống tăng 7,41% so với cuối năm 2025, trong khi huy động vốn chỉ tăng hơn 5%.","Nói cách khác, khi cầu vốn tăng nhanh hơn cung vốn, nguồn vốn trở nên khan hiếm tương đối và lãi suất huy động tăng chính là mức giá ngân hàng phải trả cao hơn để thu hút nguồn tiền còn lại trên thị trường.","### Lý do 2: Nhà nước cũng đang đi vay","Để xây đường, cầu và các công trình lớn, Nhà nước cần rất nhiều tiền. Một cách họ huy động là bán trái phiếu, hiểu đơn giản là “giấy vay nợ” của Nhà nước. Người mua chủ yếu là ngân hàng, công ty bảo hiểm và quỹ đầu tư, tức là những nơi cũng đang nắm giữ tiền của người dân. Theo VNDirect, kế hoạch huy động khoảng 500.000 tỷ đồng trái phiếu chính phủ trong năm 2026 sẽ tạo thêm sức ép lên mặt bằng lãi suất.","Hiện tượng này trong kinh tế học có tên là **hiệu ứng lấn át** (crowding out effect). Hãy tưởng tượng cả một khu phố cùng đi vay tiền từ một quỹ chung. Khi một người vay một khoản rất lớn, số tiền còn lại cho những người khác ít đi và họ phải trả giá cao hơn mới vay được. Ở đây, “người vay lớn” là Nhà nước, còn “những người còn lại” là doanh nghiệp và người dân. Khi nguồn tiền trong hệ thống ngân hàng bị chia sẻ cho nhiều nơi, các ngân hàng phải tăng lãi suất để giữ và thu hút tiền gửi.","Điều này không có nghĩa đầu tư công là xấu. Hạ tầng tốt giúp kinh tế phát triển về lâu dài. Chỉ là khi Nhà nước vay nhiều đúng lúc tiền trong hệ thống đang không dư dả, lãi suất chung sẽ bị kéo lên.","### Lý do 3: Ngân hàng không thể để lãi suất tiết kiệm quá thấp","Tiền luôn chảy về nơi có lãi cao hơn. Nếu lãi suất tiết kiệm bằng tiền VND quá thấp, nhiều người sẽ chuyển sang giữ USD hoặc đưa tiền vào các kênh khác như chứng khoán, vàng. Khi người dân có thêm lựa chọn hấp dẫn hơn, ngân hàng muốn giữ chân người gửi thì buộc phải đưa ra mức lãi suất đủ cạnh tranh. Nói cách khác, dù ai cũng mong lãi suất vay rẻ hơn, một ngân hàng không thể tự ý hạ lãi suất huy động quá thấp. Nếu làm vậy, tiền gửi sẽ chảy sang nơi khác, và họ không còn tiền để cho vay.","Cả ba yếu tố trên đều làm ngân hàng thương mại khó giảm lãi suất: cầu vốn lớn, nguồn vốn bị chia sẻ với Nhà nước, và áp lực phải giữ chân người gửi tiền. Không có một quyết định đơn lẻ nào đẩy lãi suất lên. Đó là kết quả của nhiều lực kéo cùng lúc.","Gần đây đã có dấu hiệu hạ nhiệt: theo một số báo cáo, sau chỉ đạo của Chính phủ, lãi suất tiết kiệm đã chững lại. Nhưng những áp lực gốc vẫn còn đó, nên chúng ta vẫn cần theo dõi thêm.","**3. Vậy ai quyết định lãi suất ngân hàng?**","Câu trả lời ngắn gọn là: không chỉ một bên. Có thể hình dung thành ba lớp.","Lớp thứ nhất là **Ngân hàng Nhà nước**, cơ quan điều hành chính sách tiền tệ. Cơ quan này dùng nhiều công cụ để tác động đến thanh khoản và mặt bằng lãi suất, đồng thời đặt trần cho lãi suất huy động ngắn hạn, ví dụ 4,75%/năm với kỳ hạn dưới 6 tháng.","Lớp thứ hai là **các ngân hàng thương mại**. Với kỳ hạn từ 6 tháng trở lên, mỗi ngân hàng tự định mức lãi suất trong khuôn khổ pháp luật, tùy vào nhu cầu vốn, chi phí và sức cạnh tranh của mình. Đó là lý do cùng một kỳ hạn nhưng mỗi nơi niêm yết một mức khác nhau.","Lớp thứ ba là **chính chúng ta, những người gửi tiền và người đi vay**. Người gửi chọn nơi trả cao hơn, người vay chọn nơi rẻ hơn. Những lựa chọn nhỏ ấy cộng lại và buộc ngân hàng phải điều chỉnh.","**4. Lãi suất huy động tăng có đồng nghĩa lãi suất cho vay sẽ tăng tương ứng?**","Lãi suất cho vay cũng đã tăng, thậm chí tăng nhiều hơn. Theo số liệu Ngân hàng Nhà nước công bố, lãi suất cho vay bình quân trong tháng 8/2026 đạt khoảng 10,7%/năm, cao hơn gần 2 điểm phần trăm so với cuối năm 2025. Trong khi đó, lãi suất tiền gửi bình quân của các giao dịch mới tăng 1,15 điểm phần trăm tính đến tháng 9. Hai số liệu thuộc hai tháng khác nhau nên chỉ nên xem là so sánh tương đối.","Nói cách khác, khoảng cách giữa lãi suất cho vay và lãi suất tiền gửi đã rộng thêm. Chi phí huy động tăng chưa phải là toàn bộ câu chuyện, vì lãi suất cho vay còn gồm chi phí hoạt động, rủi ro của khách hàng và sức cạnh tranh của từng ngân hàng. Khi chi phí vốn tăng, ngân hàng có thể nâng lãi suất cho vay, thu hẹp biên lợi nhuận hoặc kết hợp cả hai.","Điều người vay cần quan tâm không chỉ là lãi suất niêm yết, mà còn là lãi suất thực tế áp dụng cho khoản vay của mình, đặc biệt sau khi hết thời gian ưu đãi và chuyển sang lãi suất thả nổi.","**Kết luận**","Quay lại ba câu hỏi ở đầu bài. Điều gì khiến lãi suất tăng? Có ba lực kéo cùng lúc: người cần vay nhiều hơn người gửi tiền, Nhà nước cũng đang vay lớn và tạo ra hiệu ứng lấn át, và ngân hàng phải cạnh tranh để giữ người gửi trước các kênh khác như USD, chứng khoán, vàng. Ai là người quyết định? Ngân hàng Nhà nước đặt luật chơi chung, các ngân hàng thương mại tự định giá, và người gửi, người vay “bỏ phiếu” bằng lựa chọn của mình.","Còn vì sao không thể đơn giản yêu cầu ngân hàng giảm lãi suất? Vì lãi suất là giá của tiền, mà giá thì không thể hạ chỉ bằng mong muốn. Nếu ép lãi suất huy động xuống quá thấp khi tiền đang khan hiếm, người dân sẽ chuyển tiền sang nơi khác, ngân hàng thiếu nguồn vốn và người cần vay có thể còn khó vay hơn.","Và có lẽ, mỗi khi nghe tin lãi suất tăng hoặc giảm, thay vì chỉ hỏi “Điều này tốt hay xấu?”, chúng ta có thể bắt đầu bằng một câu hỏi khác: Vì sao lãi suất phải thay đổi ở thời điểm này, và sự thay đổi đó sẽ ảnh hưởng đến những ai?"],"draft":false},{"id":"thoi-quen-viet","topic":"Suy nghĩ","series":"","date":"28 tháng 10, 2026","title":"Vì sao mình tạo blog này","excerpt":"Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được…","body":["Mình là người thích quan sát và chiêm nghiệm. Đôi khi, từ một câu chuyện tình cờ nghe được, một điều nhỏ nhặt xảy ra trong ngày cũng tạo cho mình một ý tưởng mới. Mình thường tự đặt câu hỏi, thử nhìn một vấn đề từ nhiều góc độ và tìm cách lý giải nó theo cách hiểu của riêng mình.","Nhưng mình nhận ra, có những suy nghĩ cứ quanh quẩn mãi trong đầu mà chẳng đi đến đâu. Có những điều tưởng rằng đã hiểu, nhưng khi muốn diễn đạt lại thì mình vẫn chưa biết bắt đầu từ đâu. Vì vậy, mình muốn thử viết chúng ra, thay vì chỉ giữ chúng trong những cuộc đối thoại với chính mình.","Mình muốn ghi lại những điều mình quan sát, những câu hỏi mình còn băn khoăn và cả những điều mình dần nhận ra sau mỗi trải nghiệm. Không phải suy nghĩ nào cũng cần một câu trả lời, cũng không phải vấn đề nào cũng cần được giải quyết ngay. Đôi khi, chỉ cần viết xuống và nhìn nhận nó rõ ràng hơn, mình đã có thể hiểu bản thân thêm một chút.","Vì thế, mình muốn biến việc viết thành một cách để học hỏi. Để những điều mình đọc không chỉ dừng lại ở việc từng biết, mà dần trở thành kiến thức của riêng mình.","Và mình muốn, qua từng bài viết nhỏ, mình có thể hiểu thế giới rõ hơn một chút, hiểu bản thân sâu hơn một chút, và lưu giữ lại hành trình của chính mình.","Ngọc Hân"]}]</script>
<script>
var all=JSON.parse(document.getElementById('data').textContent);
var posts=all.filter(function(p){return !p.draft});
var canEdit=false,armed=null,app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'khac'}
function topics(){var r=[];posts.forEach(function(p){if(r.indexOf(p.topic)<0)r.push(p.topic)});return r}
function mins(p){return Math.max(1,Math.ceil(p.body.join(' ').split(/\s+/).length/200))}
var TMAP={'tai-chinh':0,'tam-ly-hoc':1,'suy-nghi':2,'chung':3};
function tcls(t){var k=slug(t);if(TMAP[k]===undefined){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%997;return 't'+(4+h%4)}return 't'+TMAP[k]}
function meta(p){return (p.draft?'<span class="dr">Nháp</span>':'')+esc(p.date)+' · <span class="tn '+tcls(p.topic)+'">'+esc(p.topic)+'</span> · Đọc trong '+mins(p)+' phút'}
function inl(s){s=esc(s);
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
 return s}
function fmt(body){return body.map(function(t){
 var m=t.match(/^(#{2,3})\s+([\s\S]*)$/);
 if(m)return m[1].length===2?'<h2 class="ph">'+inl(m[2])+'</h2>':'<h3 class="ph">'+inl(m[2])+'</h3>';
 if(/^[-•]\s/.test(t))return '<ul>'+t.split('\n').map(function(l){return '<li>'+inl(l.replace(/^[-•]\s+/,''))+'</li>'}).join('')+'</ul>';
 return '<p>'+inl(t).replace(/\n/g,'<br>')+'</p>'}).join('')}
function wrap(m){var t=document.getElementById('f-body'),a=t.selectionStart,b=t.selectionEnd,x=t.value,sel=x.slice(a,b),r,s1=null,e1=null;
 function pre(){var h=x.slice(0,a);return a===0||/\n\n$/.test(h)?'':(/\n$/.test(h)?'\n':'\n\n')}
 function post(){var h=x.slice(b);return h===''||/^\n\n/.test(h)?'':(/^\n/.test(h)?'\n':'\n\n')}
 if(m==='b')r='**'+(sel||'chữ đậm')+'**';
 else if(m==='i')r='*'+(sel||'chữ nghiêng')+'*';
 else if(m==='h')r=pre()+'## '+(sel||'Tiêu đề')+post();
 else if(m==='l')r=pre()+(sel||'mục 1\nmục 2').split('\n').map(function(l){return '- '+l.replace(/^[-•]\s+/,'')}).join('\n')+post();
 else if(m==='a'){r='['+(sel||'văn bản liên kết')+'](https://)';s1=a+r.length-9;e1=a+r.length-1}
 t.value=x.slice(0,a)+r+x.slice(b);t.focus();t.setSelectionRange(s1===null?a:s1,e1===null?a+r.length:e1)}
function initTb(){var bs=document.querySelectorAll('.tbtn');if(!bs.length)return;
 bs.forEach(function(b){b.onclick=function(){wrap(b.getAttribute('data-m'))}});
 document.getElementById('f-body').addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&!e.shiftKey){var k=e.key.toLowerCase();if(k==='b'||k==='i'){e.preventDefault();wrap(k)}}})}
function seriesList(t){var r=[];posts.forEach(function(p){if(p.series&&r.indexOf(p.series)<0&&(!t||slug(p.topic)===t))r.push(p.series)});return r}
function inSeries(s){return posts.filter(function(p){return p.series===s}).reverse()}
function tagsFor(f){var s=seriesList(f);return s.length?'<div class="chips">'+s.map(function(x){return '<a class="chip tag" href="#series-'+slug(x)+'">#'+esc(x)+'</a>'}).join('')+'</div>':''}
function badge(p){if(!p.series)return '';var l=inSeries(p.series);return '<div style="margin:12px 0 4px"><a class="chip tag" style="font:500 13px Inter,system-ui,sans-serif;padding:5px 14px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--accent)" href="#series-'+slug(p.series)+'">#'+esc(p.series)+' · Phần '+(l.indexOf(p)+1)+'/'+l.length+'</a></div>'}
function seriesNav(p){if(!p.series)return '';var l=inSeries(p.series),i=l.indexOf(p),a=l[i-1],b=l[i+1];return '<div class="sn"><span>'+(a?'<a href="#'+a.id+'">← Phần '+i+': '+esc(a.title)+'</a>':'')+'</span><span style="text-align:right">'+(b?'<a href="#'+b.id+'">Phần '+(i+2)+': '+esc(b.title)+' →</a>':'')+'</span></div>'}
function seriesPage(sl){var name=seriesList().filter(function(x){return slug(x)===sl})[0];if(!name)return home();var l=inSeries(name);return '<div class="chips"><a class="chip" href="#">← Tất cả</a></div><article style="padding-bottom:0"><div class="meta">Series · '+l.length+' bài</div><h1>#'+esc(name)+'</h1></article>'+l.map(function(p,i){return '<a class="post" href="#'+p.id+'"><div class="meta">Phần '+(i+1)+' · '+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('')}
function today(){var d=new Date();return d.getDate()+' tháng '+(d.getMonth()+1)+', '+d.getFullYear()}
var curF='';
function nz(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function cards(f,q){var k=nz(q||'').trim();var l=posts.filter(function(p){if(f&&slug(p.topic)!==f)return false;return !k||nz([p.title,p.topic,p.series,p.excerpt,p.body.join(' ')].join(' ')).indexOf(k)>=0});
 if(!l.length)return '<div class="empty">Không có bài nào khớp với “'+esc(q||'')+'”.</div>';
 return l.map(function(p){return '<a class="post '+tcls(p.topic)+(p.draft?' draft':'')+'" href="#'+p.id+'"><div class="meta">'+meta(p)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p></a>'}).join('')}
function home(f){
 var chips='<div class="chips"><a class="chip'+(f?'':' on')+'" href="#">Tất cả</a>'+topics().map(function(t){return '<a class="chip tc '+tcls(t)+(slug(t)===f?' on':'')+'" href="#chu-de-'+slug(t)+'"><i class="dot"></i>'+esc(t)+'</a>'}).join('')+'</div>';
 var add=canEdit?'<div class="bar"><a class="btn" href="#viet-bai">+ Viết bài mới</a><button class="btn alt" id="dl">Tải về file HTML</button><span id="msg"></span></div>':'';
 curF=f||'';var sb='<input id="q" type="search" placeholder="Tìm bài viết…" aria-label="Tìm bài viết" autocomplete="off">';return add+sb+chips+tagsFor(f)+'<div id="plist">'+cards(curF,'')+'</div>';
}
function about(){return '<article><h1>Xin chào, mình là…</h1><p>Đây là góc nhỏ để mình viết về cuộc sống thường ngày: những buổi sáng, những món ăn, những suy nghĩ vụn vặt.</p><p>Bạn hãy thay phần giới thiệu này bằng đôi dòng về chính bạn nhé.</p><a class="back" href="#">← Về trang chủ</a></article>'}
function editor(p){
 p=p||{title:'',topic:'',date:today(),excerpt:'',body:[]};
 return '<article><a class="back" href="#">← Hủy</a><h1>'+(p.id?'Sửa bài viết':'Viết bài mới')+'</h1>'
 +'<label>Tiêu đề</label><input id="f-title" value="'+esc(p.title)+'">'
 +'<label>Chủ đề (chọn chủ đề có sẵn hoặc gõ chủ đề mới)</label><input id="f-topic" list="tl" value="'+esc(p.topic)+'"><datalist id="tl">'+topics().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Series (tùy chọn, ví dụ Lãi suất; để trống nếu là bài lẻ)</label><input id="f-series" list="sl" value="'+esc(p.series||'')+'"><datalist id="sl">'+seriesList().map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'</datalist>'
 +'<label>Ngày</label><input id="f-date" value="'+esc(p.date)+'">'
 +'<label>Mô tả ngắn (để trống thì tự lấy từ đoạn đầu)</label><input id="f-excerpt" value="'+esc(p.excerpt)+'">'
 +'<label>Nội dung (cách một dòng trống để sang đoạn mới)</label><div class="tb"><button class="tbtn" data-m="b"><b>B</b></button><button class="tbtn" data-m="i"><i>I</i></button><button class="tbtn" data-m="h">Tiêu đề</button><button class="tbtn" data-m="l">Danh sách</button><button class="tbtn" data-m="a">Liên kết</button></div><textarea id="f-body" rows="12">'+esc(p.body.join('\n\n'))+'</textarea>'
 +'<div class="hint">Chọn đoạn chữ rồi bấm nút. Cũng dùng được Ctrl+B (đậm) và Ctrl+I (nghiêng).</div><label style="display:flex;align-items:center;gap:8px;margin:20px 0 0;font:500 14px Inter,system-ui,sans-serif;color:var(--text);cursor:pointer"><input type="checkbox" id="f-draft" style="width:auto;padding:0;margin:0"'+(p.draft?' checked':'')+'> Đây là bản nháp (chỉ mình tôi thấy)</label><div class="bar"><button class="btn" id="save">Lưu và đăng</button><span id="msg"></span></div></article>';
}
function v(id){return document.getElementById(id).value}
function say(t){var m=document.getElementById('msg');if(m)m.textContent=t}
function save(id){
 var t=v('f-title').trim(),tp=v('f-topic').trim()||'Chung';
 var body=v('f-body').split(/\n\s*\n/).map(function(s){return s.trim()}).filter(Boolean);
 if(!t){say('Hãy nhập tiêu đề.');return}
 if(!body.length){say('Hãy nhập nội dung.');return}
 var ex=v('f-excerpt').trim()||body[0].slice(0,90)+(body[0].length>90?'…':'');
 var o={id:id||slug(t)+'-'+Date.now().toString(36),topic:tp,series:v('f-series').trim().replace(/^#/,''),date:v('f-date').trim()||today(),title:t,excerpt:ex,body:body,draft:!!document.getElementById('f-draft').checked};
 if(id)posts=posts.map(function(x){return x.id===id?o:x});else posts.unshift(o);
 commit('#'+o.id);
}
function commit(hash){
 say('Đang lưu…');
 claude.use('artifact').then(function(a){
  if(!a){say('Không lưu được ở đây.');return}
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');
  c.removeAttribute('data-theme');c.removeAttribute('style');location.hash=hash;
  return a.publish('<!DOCTYPE html>\n'+c.outerHTML);
 }).catch(function(e){say('Lưu không được: '+((e&&e.message)||'lỗi'))});
}
function buildDoc(){var c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(posts).replace(/</g,'\\u003c');c.removeAttribute('data-theme');c.removeAttribute('style');return '<!DOCTYPE html>\n'+c.outerHTML}
function download(){claude.use('downloads').then(function(d){if(!d){say('Không tải được ở đây.');return}return d.save({filename:'index.html',data:buildDoc()})}).catch(function(e){if(!e||e.code!=='declined')say('Tải không được.')})}
function render(){
 var h=location.hash.replace('#',''),html='',on='n-home',p,bind=null;
 if(h.indexOf('chu-de-')===0){html=home(h.slice(7))}
 else if(h.indexOf('series-')===0){html=seriesPage(h.slice(7))}
 else if(h==='viet-bai'&&canEdit){html=editor();bind=function(){document.getElementById('save').onclick=function(){save(null)}}}
 else if(h.indexOf('sua-')===0&&canEdit&&(p=posts.filter(function(x){return x.id===h.slice(4)})[0])){html=editor(p);bind=function(){document.getElementById('save').onclick=function(){save(p.id)}}}
 else if((p=posts.filter(function(x){return x.id===h})[0])){
  var tools=canEdit?'<div class="bar"><a class="btn alt" href="#sua-'+p.id+'">Sửa bài</a><button class="btn alt" id="del">Xóa bài</button><span id="msg"></span></div>':'';
  html='<article id="post"><a class="back" href="#">← Tất cả bài viết</a><div class="meta" style="margin-top:22px">'+meta(p)+'</div>'+badge(p)+'<h1>'+esc(p.title)+'</h1>'+fmt(p.body)+seriesNav(p)+tools+'</article>';
  bind=function(){var d=document.getElementById('del');if(!d)return;d.onclick=function(){if(armed!==p.id){armed=p.id;d.textContent='Bấm lần nữa để xóa';return}posts=posts.filter(function(x){return x.id!==p.id});commit('#')}};
 } else html=home();
 app.innerHTML=html;
 document.getElementById('n-home').className=on==='n-home'?'on':'';
 
 if(bind)bind();
 initTb();
 var dl=document.getElementById('dl');if(dl)dl.onclick=download;
 var qi=document.getElementById('q');if(qi)qi.oninput=function(){document.getElementById('plist').innerHTML=cards(curF,qi.value)};
 var fd=document.getElementById('f-draft'),sv=document.getElementById('save');if(fd&&sv){var upd=function(){sv.textContent=fd.checked?'Lưu nháp':'Lưu và đăng'};fd.onchange=upd;upd()}
 window.scrollTo(0,0);onScroll();
}
function onScroll(){var y=window.pageYOffset||document.documentElement.scrollTop,max=document.documentElement.scrollHeight-window.innerHeight,pg=document.getElementById('pg'),tp=document.getElementById('top'),post=!!document.getElementById('post');
 if(pg){pg.style.display=post?'block':'none';pg.style.width=(post&&max>0?Math.min(100,y/max*100):0)+'%'}
 if(tp)tp.className=y>600?'show':''}
window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onScroll);
document.getElementById('top').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('theme').onclick=function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';r.setAttribute('data-theme',n);r.style.colorScheme=n;try{localStorage.setItem('theme',n)}catch(e){}};
window.addEventListener('hashchange',render);
render();
if(window.claude&&claude.use)claude.use('user').then(function(u){if(u&&u.canEdit()){canEdit=true;posts=all;render()}}).catch(function(){});
</script>
